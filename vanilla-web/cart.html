<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cart & Customization</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background-color: #f5f5f5;
            color: #333;
        }

        /* Header */
        .header {
            background: linear-gradient(135deg, #1e9cfa 0%, #0ea5e9 100%);
            color: white;
            padding: 12px 24px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 8px;
            font-weight: 600;
            font-size: 16px;
        }

        .logo-icon {
            width: 32px;
            height: 32px;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .header-actions {
            display: flex;
            align-items: center;
            gap: 16px;
        }

        .user-avatar {
            width: 32px;
            height: 32px;
            background: white;
            border-radius: 50%;
            color: black;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 600;
            font-size: 14px;
            cursor: pointer;
        }

        /* Progress Steps */
        .progress-container {
            background: white;
            padding: 24px;
            border-bottom: 1px solid #e5e7eb;
            max-width: 1280px;
            margin:10px auto;
            border-radius: 16px;
        }

        .progress-steps {
            display: flex;
            justify-content: center;
            align-items: center;
            max-width: 600px;
            margin: 0 auto;
        }

        .step {
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            flex: 1;
            position: relative;
        }

        .step:not(:last-child)::after {
             content: '';
            position: absolute;
            top: 24px;
            right: -50%;
            width: 100%;
            height: 2px;
            background: #e5e7eb;
            z-index: 1;
        }

        .step-icon {
            width: 48px;
            height: 48px;
            border-radius: 12px;
            background: #fff;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 12px;
            position: relative;
            z-index: 2;
            font-size: 20px;
            color: #9ca3af;
            border: 1px solid #E4E7EC;
        }

        .step-label {
              font-size: 14px;
            color: #6b7280;
            font-weight: 500;
        }

        .step.active .step-label {
            color: #344054;
        }

        /* Main Content */
        .main-content {
             background: white;
            padding: 32px 14px;
            min-height: calc(100vh - 200px);
            max-width: 1280px;
            margin:10px auto;
            border-radius: 16px;
            display: flex;
        }

        .content-wrapper {
            margin: 0 auto;
            display: grid;
            grid-template-columns: 1fr 400px;
            gap: 48px;
        }

        /* Left Column - Product Info */
        .product-section {
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .product-display {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            margin-bottom: 0;
            width: 100%;
        }

        .product-image {
            width: 100%;
            max-width: 600px;
            height: 400px;
            background: white;
            border-radius: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: none;
            margin-bottom: 32px;
        }

        .product-image img {
            width: 100%;
            height: 100%;
            object-fit: contain;
        }

        .placeholder-image {
            color: #9ca3af;
            font-size: 48px;
        }

        .product-description {
            color: #6b7280;
            font-size: 16px;
            line-height: 1.6;
            max-width: 600px;
            text-align: left;
        }

        /* Right Column - Order Details */
        .order-section {
            background: #f9fafb;
            border-radius: 12px;
            padding: 24px;
            height: fit-content;
        }

        .order-title {
            font-size: 16px;
            color: #6b7280;
            margin-bottom: 8px;
        }

        .product-name {
            font-size: 24px;
            font-weight: 700;
            color: #111827;
            margin-bottom: 8px;
        }

        .product-price {
            font-size: 24px;
            font-weight: 700;
            color: #111827;
            margin-bottom: 24px;
        }

        .order-total-section {
            border-top: 1px solid #e5e7eb;
            padding-top: 16px;
            margin-bottom: 24px;
        }

        .order-total-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 8px;
        }

        .order-total-label {
            font-size: 16px;
            color: #111827;
            font-weight: 600;
        }

        .order-total-value {
            font-size: 18px;
            font-weight: 700;
            color: #111827;
        }

        .customize-btn {
            background: white;
            border: 1px solid #d1d5db;
            color: #374151;
            padding: 12px 24px;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            width: 100%;
            margin-bottom: 12px;
            transition: all 0.2s ease;
        }

        .customize-btn:hover {
            border-color: #1e9cfa;
            background: #f0f9ff;
        }

        .checkout-btn {
            background: #0086C9;
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            width: 100%;
            margin-bottom: 24px;
            transition: background 0.2s ease;
        }

        .benefit-icon {
            width: 16px;
            height: 16px;
            border:2px solid #0086C9;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
        }

        .benefit-icon::after {
            content: '✓';
            color: #0086C9;
            font-size: 10px;
            font-weight: bold;
        }

        .benefit-item {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 6px 0;
            font-size: 14px;
            color: #475467;
            text-align: left;
        }

        .benefits-list {
            list-style: none;
            padding: 0;
            margin: 0;
        }

        .benefits-title {
            font-size: 16px;
            font-weight: 600;
            color: #111827;
            margin-bottom: 16px;
            text-align: left;
        }

        .benefits-section {
            display: block;
            padding: 20px 0 0 0;
            border-top: 1px solid #E4E7EC;
            margin-top: 20px;
        }

        .checkout-btn:hover {
            background: #0284c7;
        }

        .upgrade-section {
            margin-top: 24px;
        }

        .upgrade-title {
            font-size: 16px;
            font-weight: 600;
            color: #111827;
            margin-bottom: 16px;
        }

        .upgrade-option {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 12px;
            border: 1px solid #e5e7eb;
            border-radius: 8px;
            margin-bottom: 8px;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .upgrade-option:hover {
            border-color: #1e9cfa;
            background: #f0f9ff;
        }

        .upgrade-info {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .upgrade-image {
            width: 40px;
            height: 24px;
            border-radius: 4px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .upgrade-details {
            display: flex;
            flex-direction: column;
        }

        .upgrade-name {
            font-size: 14px;
            font-weight: 600;
            color: #111827;
        }

        .upgrade-price {
            font-size: 12px;
            color: #6b7280;
        }

        .upgrade-checkbox {
            width: 18px;
            height: 18px;
            border: 2px solid #d1d5db;
            border-radius: 3px;
            cursor: pointer;
            position: relative;
        }

        .upgrade-checkbox.checked {
            background: #1e9cfa;
            border-color: #1e9cfa;
        }

        .upgrade-checkbox.checked::after {
            content: '✓';
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: white;
            font-size: 12px;
            font-weight: bold;
        }

        /* Footer Navigation */
        .footer-nav {
             background: white;
            padding: 16px 24px;
            border-top: 1px solid #e5e7eb;
            display: flex;
            justify-content: space-between;
            align-items: center;
            max-width: 1280px;
            margin:10px auto;
            border-radius: 16px;
        }

        .back-btn {
            background: none;
            border: none;
            color: #6b7280;
            font-size: 14px;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 8px 16px;
        }

        .save-btn {
            background: #0086C9;
            border: none;
            color: white;
            font-size: 14px;
            padding: 8px 24px;
            border-radius: 6px;
            cursor: pointer;
        }

        /* Loading and Error States */
        .loading {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 200px;
            font-size: 16px;
            color: #6b7280;
        }

        .spinner {
            width: 20px;
            height: 20px;
            border: 2px solid #e5e7eb;
            border-top: 2px solid #0ba5ec;
            border-radius: 50%;
            margin-right: 12px;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .error {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 200px;
            font-size: 16px;
            color: #dc2626;
            flex-direction: column;
            gap: 12px;
        }

        /* Responsive Design */
        @media (max-width: 1024px) {
            .content-wrapper {
                grid-template-columns: 1fr;
                gap: 32px;
            }

            .order-section {
                order: -1;
            }
        }

        @media (max-width: 768px) {
            .header {
                padding: 12px 16px;
            }

            .main-content {
                padding: 24px 16px;
            }

            .product-image {
                width: 100%;
                max-width: 350px;
                height: 200px;
            }

            .footer-nav {
                padding: 16px;
            }
        }

        @media (max-width: 480px) {
            .product-image {
                height: 180px;
            }

            .order-section {
                padding: 20px;
            }
        }
    </style>
</head>
<body>
    <!-- Header -->
     <div class="header">
        <div class="logo">
            <div class="logo-icon">
                <span style="font-size: 20px;">📦</span>
            </div>
            <span>Ezra</span>
        </div>
        <div class="header-actions">
            <div class="user-avatar">MM</div>
        </div>
    </div>

    <!-- Progress Steps -->
      <div class="progress-container">
        <div class="progress-steps">
            <div class="step">
                <div class="step-icon">
                    <span>📦</span>
                </div>
                <div class="step-label">Choose Package</div>
            </div>
            <div class="step active">
                <div class="step-icon">
                    <span>🛒</span>
                </div>
                <div class="step-label">Cart & Customization</div>
            </div>
            <div class="step">
                <div class="step-icon">
                    <span>📄</span>
                </div>
                <div class="step-label">Invoice</div>
            </div>
        </div>
    </div>

    <!-- Main Content -->
    <div class="main-content">
        <div class="content-wrapper">
            <!-- Left Column - Product Display -->
             <div>
                <div id="product-display">
                    <!-- Product will be loaded here -->
                </div>
            </div>

             <!-- Right Column - Order Details -->
            <div class="order-section">
                <div class="order-title">Order Details</div>
                <h2 id="selected-product-name" class="product-name">Loading...</h2>
                <div id="selected-product-price" class="product-price">R0</div>
                
                <div class="order-total-section">
                    <div class="order-total-row">
                        <span class="order-total-label">Order Total</span>
                        <span id="order-total" class="order-total-value">R0</span>
                    </div>
                </div>
                
                <button class="customize-btn" onclick="goToExtras()">Customize</button>
                <button class="checkout-btn" onclick="proceedToCheckout()">Proceed to Checkout</button>
                
                <div class="upgrade-section">
                    <h3 class="upgrade-title">Upgrade Package</h3>
                    <div id="upgrade-options">
                        <!-- Upgrade options will be loaded here -->
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Footer Navigation -->
    <div class="footer-nav">
        <button class="back-btn" onclick="goBack()">
            ← Back
        </button>
        <button class="save-btn" onclick="saveState()">Save</button>
    </div>

    <script>
        // Global state management
        const AppState = {
            selectedProduct: null,
            allProducts: [],
            extras: [],
            selectedExtras: JSON.parse(localStorage.getItem('selectedExtras') || '[]'),
            orderTotal: 0
        };

        // API Configuration
        const API_CONFIG = {
            baseUrl: 'https://fff.sandbox.api.ezra360.com/api/v1.0/entities/ExecuteRequest',
            apiKey: 'TPiNa.aoAj0IkST3vQlyM9BRPiKphXmXSIxinKB8mPXSbnx5U',
            recordId: '41822ddd-155b-4470-9aed-dddf5219c6d5'
        };

        // API Functions
        async function fetchProducts() {
            const myHeaders = new Headers();
            myHeaders.append("api-key", API_CONFIG.apiKey);
            myHeaders.append("Content-Type", "application/json");

            const raw = JSON.stringify({
                "entityName": "ProductGroup",
                "requestName": "ProductGroupListingExecuteRequest"
            });

            const requestOptions = {
                method: "POST",
                headers: myHeaders,
                body: raw,
                redirect: "follow"
            };

            try {
                const response = await fetch(API_CONFIG.baseUrl, requestOptions);
                const result = await response.json();
                
                if (result.isSuccess && result.outputParameters) {
                    return result.outputParameters.ProductGroupData || [];
                } else {
                    throw new Error('Failed to fetch products');
                }
            } catch (error) {
                console.error('Error fetching products:', error);
                throw error;
            }
        }

        // Utility Functions
        function formatPrice(price) {
            return `R${parseFloat(price || 0).toLocaleString()}`;
        }

        function calculateTotal() {
            let total = parseFloat(AppState.selectedProduct?.price || 0);
            
            AppState.selectedExtras.forEach(extra => {
                total += parseFloat(extra.costPrice || 0) * (extra.quantity || 1);
            });
            
            AppState.orderTotal = total;
            return total;
        }

        // UI Functions
        function renderProductDisplay(product) {
            const hasImage = product.url && product.url.trim() !== '';
            const benefits = product.benefits ? product.benefits.split(', ') : [];
            
            return `
                <div class="product-image">
                    ${hasImage 
                        ? `<img src="${product.url}" alt="${product.productGroupName}" onerror="this.style.display='none'; this.nextElementSibling.style.display='flex';" />
                           <div class="placeholder-image" style="display: none;">📦</div>` 
                        : `<div class="placeholder-image">📦</div>`
                    }
                </div>
                <div class="product-description">
                    Provide your audience with an extensive array of options, ensuring a comprehensive showcase of the full range of product features. Our diverse selection caters to various preferences and needs, empowering customers to explore and find the perfect fit for their requirements.
                </div>
                ${benefits.length > 0 ? `
                    <div class="benefits-section">
                        <h4 class="benefits-title">Benefits</h4>
                        <ul class="benefits-list">
                            ${benefits.map(benefit => `
                                <li class="benefit-item">
                                    <div class="benefit-icon"></div>
                                    <span>${benefit.trim()}</span>
                                </li>
                            `).join('')}
                        </ul>
                    </div>
                ` : ''}
            `;
        }

        function renderUpgradeOptions(products, selectedProductId) {
            return products.map(product => `
                <div class="upgrade-option" data-product-id="${product.productGroupId}" data-price="${product.price}">
                    <div class="upgrade-info">
                        <div class="upgrade-image">
                            ${product.url 
                                ? `<img src="${product.url}" alt="${product.productGroupName}" width="40" height="24" style="object-fit: contain;" onerror="this.style.display='none';" />` 
                                : `<span style="font-size: 16px;">📦</span>`
                            }
                        </div>
                        <div class="upgrade-details">
                            <div class="upgrade-name">${product.productGroupName}</div>
                            <div class="upgrade-price">${formatPrice(product.price)}</div>
                        </div>
                    </div>
                    <div class="upgrade-checkbox ${product.productGroupId === selectedProductId ? 'checked' : ''}"></div>
                </div>
            `).join('');
        }

        function updateOrderSummary() {
            const total = calculateTotal();
            
            document.getElementById('selected-product-name').textContent = AppState.selectedProduct?.productGroupName || 'No product selected';
            document.getElementById('selected-product-price').textContent = formatPrice(AppState.selectedProduct?.price || 0);
            document.getElementById('order-total').textContent = formatPrice(total);
        }

        // Event Handlers
        function selectUpgradeProduct(productId) {
            const product = AppState.allProducts.find(p => p.productGroupId === productId);
            if (product) {
                AppState.selectedProduct = product;
                
                // Update localStorage
                localStorage.setItem('selectedProduct', JSON.stringify(product));
                
                // Update UI
                document.getElementById('product-display').innerHTML = renderProductDisplay(product);
                updateOrderSummary();
                
                // Update checkboxes
                document.querySelectorAll('.upgrade-checkbox').forEach(checkbox => {
                    checkbox.classList.remove('checked');
                });
                document.querySelector(`[data-product-id="${productId}"] .upgrade-checkbox`).classList.add('checked');
            }
        }

        function goToExtras() {
            // Save current state before navigating
            saveState();
            window.location.href = 'extras.html';
        }

        function proceedToCheckout() {
            // Save current state before navigating
            saveState();
            window.location.href = 'invoice.html';
        }

        function goBack() {
            window.location.href = 'products.html';
        }

        function saveState() {
            const state = {
                selectedProduct: AppState.selectedProduct,
                selectedExtras: AppState.selectedExtras,
                orderTotal: AppState.orderTotal
            };
            localStorage.setItem('appState', JSON.stringify(state));
            alert('State saved successfully!');
        }

        // Initialization
        async function initializePage() {
            try {
                // Load selected product from localStorage
                const selectedProductData = localStorage.getItem('selectedProduct');
                if (selectedProductData) {
                    AppState.selectedProduct = JSON.parse(selectedProductData);
                }

                // Load saved state
                const savedState = localStorage.getItem('appState');
                if (savedState) {
                    const state = JSON.parse(savedState);
                    AppState.selectedExtras = state.selectedExtras || [];
                }

                // Fetch all products for upgrade options
                AppState.allProducts = await fetchProducts();

                // Render the page
                if (AppState.selectedProduct) {
                    document.getElementById('product-display').innerHTML = renderProductDisplay(AppState.selectedProduct);
                    
                    // Filter products for upgrades (exclude current selection initially, then show all)
                    const upgradeProducts = AppState.allProducts.filter(p => 
                        p.price > 0 && p.productGroupName && p.productGroupName.trim() !== ''
                    );
                    
                    document.getElementById('upgrade-options').innerHTML = renderUpgradeOptions(
                        upgradeProducts, 
                        AppState.selectedProduct.productGroupId
                    );

                    updateOrderSummary();

                    // Add event listeners to upgrade options
                    document.querySelectorAll('.upgrade-option').forEach(option => {
                        option.addEventListener('click', () => {
                            const productId = option.dataset.productId;
                            selectUpgradeProduct(productId);
                        });
                    });
                } else {
                    // No product selected, redirect to products page
                    alert('No product selected. Redirecting to products page.');
                    window.location.href = 'products.html';
                }

            } catch (error) {
                console.error('Failed to initialize page:', error);
                document.getElementById('product-display').innerHTML = `
                    <div class="error">
                        <div>Failed to load product data</div>
                        <button onclick="window.location.reload()">Retry</button>
                    </div>
                `;
            }
        }

        // Initialize the page when DOM is loaded
        document.addEventListener('DOMContentLoaded', initializePage);
    </script>
</body>
</html>
