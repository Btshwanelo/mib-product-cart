<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Cart & Customization</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
          Oxygen, Ubuntu, Cantarell, sans-serif;
        background-color: #f5f5f5;
        color: #333;
      }

      /* Header */
      .header {
        background: linear-gradient(135deg, #1e9cfa 0%, #0ea5e9 100%);
        color: white;
        padding: 12px 24px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
      }

      .logo {
        display: flex;
        align-items: center;
        gap: 8px;
        font-weight: 600;
        font-size: 16px;
      }

      .logo-icon {
        width: 32px;
        height: 32px;
        border-radius: 8px;
        display: flex;
        align-items: center;
        justify-content: center;
      }

      .header-actions {
        display: flex;
        align-items: center;
        gap: 16px;
      }

      .user-avatar {
        width: 32px;
        height: 32px;
        background: white;
        border-radius: 50%;
        color: black;
        display: flex;
        align-items: center;
        justify-content: center;
        font-weight: 600;
        font-size: 14px;
        cursor: pointer;
      }

      /* Progress Steps */
     .progress-container {
        background: white;
        padding: 24px;
        border-bottom: 1px solid #e5e7eb;
        max-width: 1280px;
        margin: 10px auto;
        border-radius: 16px;
      }

      .progress-steps {
        display: flex;
        justify-content: center;
        align-items: center;
        max-width: 600px;
        margin: 0 auto;
      }

      .step {
        display: flex;
        flex-direction: column;
        align-items: center;
        text-align: center;
        flex: 1;
        position: relative;
      }

      .step:not(:last-child)::after {
        content: "";
        position: absolute;
        top: 24px;
        right: -50%;
        width: 100%;
        height: 2px;
        background: #e4e7ec;
        z-index: 1;
      }

      .step.active:not(:last-child)::after {
        background: #e4e7ec;
      }
      .step-icon {
        width: 48px;
        height: 48px;
        border-radius: 12px;
        background: #fff;
        display: flex;
        align-items: center;
        justify-content: center;
        margin-bottom: 12px;
        position: relative;
        z-index: 2;
        font-size: 20px;
        color: #9ca3af;
        border: 1px solid #e4e7ec;
      }

      .step-label {
        font-size: 14px;
        color: #6b7280;
        font-weight: 500;
      }

      .step.active .step-label {
        color: #344054;
      }

      /* Main Content */
        .main-content {
        background: white;
        padding: 64px;
        min-height: calc(100vh - 200px);
        max-width: 1280px;
        margin: 10px auto;
        border-radius: 16px;
      }

      .content-wrapper {
        margin: 0 auto;
        display: grid;
        grid-template-columns: 1fr 484px;
        gap: 48px;
      }

      .page-title {
        margin-bottom: 30px;
        font-size: 30px;
        font-weight: 700;
        color: #1a1a1a;
      }

      /* Loading and Error States */
      .loading {
        display: flex;
        justify-content: center;
        align-items: center;
        height: 200px;
        font-size: 16px;
        color: #6b7280;
      }

      .spinner {
        width: 20px;
        height: 20px;
        border: 2px solid #e5e7eb;
        border-top: 2px solid #0ba5ec;
        border-radius: 50%;
        margin-right: 12px;
        animation: spin 1s linear infinite;
      }

      @keyframes spin {
        0% { transform: rotate(0deg); }
        100% { transform: rotate(360deg); }
      }

      .error {
        display: flex;
        justify-content: center;
        align-items: center;
        height: 200px;
        font-size: 16px;
        color: #dc2626;
        flex-direction: column;
        gap: 12px;
      }

      .retry-btn {
        background: #0ba5ec;
        color: white;
        border: none;
        padding: 8px 16px;
        border-radius: 6px;
        cursor: pointer;
      }

      /* Extras Grid */
      .extras-grid {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 24px;
      }

      .upgrade-option {
        display: flex;
        align-items: flex-start;
        justify-content: space-between;
        padding: 16px;
        border: 1px solid #e5e7eb;
        border-radius: 12px;
        margin-bottom: 8px;
        cursor: pointer;
        transition: all 0.2s ease;
        width: 100%;
      }

      .upgrade-option:hover {
        border-color: #1e9cfa;
        background: #f0f9ff;
      }

      .upgrade-option.selected {
        border-color: #1e9cfa;
        background: #f0f9ff;
      }

      .upgrade-info {
        display: flex;
        align-items: center;
        gap: 12px;
        flex-direction: column;
        width: 100%;
      }

      .upgrade-details {
        display: flex;
        flex-direction: column;
        justify-content: left;
        align-items: flex-start;
        width: 100%;
      }

      .upgrade-name {
        font-size: 20px;
        font-weight: 600;
        color: #1A1A1A;
        margin-bottom: 10px;
      }

      .upgrade-price {
        font-size: 18px;
        color: #1A1A1A;
        margin-bottom: 10px;
      }

      .upgrade-checkbox {
        width: 18px;
        height: 18px;
        border: 2px solid #d1d5db;
        border-radius: 40px;
        cursor: pointer;
        position: relative;
        place-self: flex-start;
      }

      .upgrade-checkbox.checked {
        background: #1e9cfa;
        border-color: #1e9cfa;
      }

      .upgrade-checkbox.checked::after {
        content: "✓";
        position: absolute;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        color: white;
        font-size: 12px;
        font-weight: bold;
      }

      .action-buttons {
        display: flex;
        width: 50%;
        height: 30px;
      }

      .minus {
        display: flex;
        padding: 3px 7px;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        cursor: pointer;
        gap: 2px;
        flex: 1 0 0;
        align-self: stretch;
        border-radius: 10px 0px 0px 10px;
        border: 1px solid #e4e7ec;
        background: #fff;
      }

      .add {
        display: flex;
        padding: 3px 7px;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        gap: 2;
        cursor: pointer;
        flex: 1 0 0;
        align-self: stretch;
        border-radius: 0px 10px 10px 0px;
        border: 1px solid #e4e7ec;
        background: #fff;
      }

      .cart-num {
        border-top: 1px solid #e4e7ec;
        border-bottom: 1px solid #e4e7ec;
        background: white;
        width: 32px;
        height: 30px;
        display: flex;
        justify-content: center;
        align-items: center;
      }

      .container {
       display: flex;
       flex-direction: column;
       gap: 24px;
      }

      .order-summary {
        background: #fff;
        align-items: flex-start;
        justify-content: space-between;
        border: 1px solid #e5e7eb;
        border-radius: 8px;
        margin-bottom: 8px;
        cursor: pointer;
        transition: all 0.2s ease;
        width: 484px;
        height: fit-content;
        border-radius: 16px;
        padding: 60px 60px 30px 60px;
      }

      .order-title {
        font-size: 16px;
        font-weight: 600;
        color: #111827;
        margin-bottom: 3px;
        border-top: 1px solid #E4E7EC;
        padding-top: 10px;
      }

      .product-name {
        font-size: 20px;
        font-weight: 700;
        color: #111827;
        margin-bottom: 3px;
        gap: 2px;
      }

      .product-price {
        font-size: 18px;
        font-weight: 600;
        color: #111827;
        margin-bottom: 3px;
      }

      .order-total-section {
        border-top: 1px solid #e5e7eb;
        padding-top: 16px;
        margin-bottom: 10px;
      }

      .order-total-row {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 10px;
      }

      .order-total-label {
        font-size: 16px;
        color: #111827;
        font-weight: 600;
      }

      .order-total-value {
        font-size: 18px;
        font-weight: 700;
        color: #111827;
      }

      .done-btn {
        background: #0086c9;
        color: white;
        padding: 10px 10px;
        font-size: 14px;
        font-weight: 1000;
        cursor: pointer;
        width: 100%;
        height: 60px;
        margin-bottom: 24px;
        transition: background 0.2s ease;
        border-radius: var(--radius-md, 8px);
        border: 2px solid
          var(
            --Gradient-skeuemorphic-gradient-border,
            rgba(255, 255, 255, 0.12)
          );
        background: var(
          --Component-colors-Components-Buttons-Primary-button-primary-bg,
          #0086c9
        );
        border-radius: var(--radius-md, 8px);
      }

      .done-btn:hover {
        background: #0284c7;
      }

      /* Footer Navigation */
       .footer-nav {
        background: white;
        padding: 16px 24px;
        border-top: 1px solid #e5e7eb;
        display: flex;
        justify-content: space-between;
        align-items: center;
        max-width: 1280px;
        margin: 10px auto;
        border-radius: 16px;
      }

      .back-btn {
        background: none;
        border: none;
        color: #6b7280;
        font-size: 14px;
        cursor: pointer;
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 8px 16px;
      }

      .save-btn {
        background: #1e9cfa;
        border: none;
        color: white;
        font-size: 14px;
        padding: 8px 24px;
        border-radius: 6px;
        cursor: pointer;
      }

      /* Responsive Design */
      @media (max-width: 1024px) {
        .content-wrapper {
          grid-template-columns: 1fr;
          gap: 32px;
        }

        .order-summary {
          order: -1;
        }
      }

      @media (max-width: 768px) {
        .header {
          padding: 12px 16px;
        }

        .main-content {
          padding: 24px 16px;
        }

        .extras-grid {
          grid-template-columns: 1fr;
        }

        .footer-nav {
          padding: 16px;
        }
      }

      @media (max-width: 480px) {
        .order-summary {
          padding: 20px;
        }
      }
    </style>
  </head>
  <body>
    <!-- Header -->
    <div class="header">
      <div class="logo">
        <div class="logo-icon">
          <span style="font-size: 20px;">📦</span>
        </div>
        <span>Ezra</span>
      </div>
      <div class="header-actions">
        <div class="user-avatar">MM</div>
      </div>
    </div>

    <!-- Progress Steps -->
    <div class="progress-container">
      <div class="progress-steps">
        <div class="step">
          <div class="step-icon">
            <span>📦</span>
          </div>
          <div class="step-label">Choose Package</div>
        </div>
        <div class="step active">
          <div class="step-icon">
            <span>🛒</span>
          </div>
          <div class="step-label">Cart & Customization</div>
        </div>
        <div class="step">
          <div class="step-icon">
            <span>📄</span>
          </div>
          <div class="step-label">Invoice</div>
        </div>
      </div>
    </div>

    <!-- Main Content -->
    <div class="main-content">
      <div class="content-wrapper">
