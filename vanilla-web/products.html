<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Choose Package</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
          Oxygen, Ubuntu, Cantarell, sans-serif;
        background-color: #f9fafb;
        color: #333;
      }

      /* Header */
      .header {
        background: #0ba5ec;
        color: white;
        padding: 12px 24px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
      }

      .logo {
        display: flex;
        align-items: center;
        gap: 8px;
        font-weight: 600;
        font-size: 16px;
      }

      .logo-icon {
        width: 40px;
        height: 40px;
        border-radius: 8px;
        display: flex;
        align-items: center;
        justify-content: center;
      }

      .header-actions {
        display: flex;
        align-items: center;
        gap: 16px;
      }

      .user-avatar {
        width: 32px;
        height: 32px;
        background: white;
        border-radius: 50%;
        color: black;
        display: flex;
        align-items: center;
        justify-content: center;
        font-weight: 600;
        font-size: 14px;
        cursor: pointer;
      }

      /* Progress Steps */
      .progress-container {
        background: white;
        padding: 24px;
        border-bottom: 1px solid #e5e7eb;
        max-width: 1280px;
        margin: 10px auto;
        border-radius: 16px;
      }

      .progress-steps {
        display: flex;
        justify-content: center;
        align-items: center;
        max-width: 600px;
        margin: 0 auto;
      }

      .step {
        display: flex;
        flex-direction: column;
        align-items: center;
        text-align: center;
        flex: 1;
        position: relative;
      }

      .step:not(:last-child)::after {
        content: "";
        position: absolute;
        top: 24px;
        right: -50%;
        width: 100%;
        height: 2px;
        background: #e5e7eb;
        z-index: 1;
      }

      .step-icon {
        width: 48px;
        height: 48px;
        border-radius: 12px;
        background: #fff;
        display: flex;
        align-items: center;
        justify-content: center;
        margin-bottom: 12px;
        position: relative;
        z-index: 2;
        font-size: 20px;
        color: #9ca3af;
        border: 1px solid #e4e7ec;
      }

      .step-label {
        font-size: 14px;
        color: #6b7280;
        font-weight: 500;
      }

      .step.active .step-label {
        color: #344054;
      }

      /* Main Content */
      .main-content {
        background: white;
        padding: 32px 24px;
        min-height: calc(100vh - 200px);
        max-width: 1280px;
        margin: 10px auto;
        border-radius: 16px;
      }

      .content-wrapper {
        max-width: 1200px;
        margin: 0 auto;
      }

      .page-title {
        font-size: 30px;
        font-weight: 700;
        color: #1a1a1a;
        margin-bottom: 8px;
      }

      .page-subtitle {
        font-size: 18px;
        color: #1a1a1a;
        font-weight: 400;
        margin-bottom: 48px;
      }

      /* Loading State */
      .loading {
        display: flex;
        justify-content: center;
        align-items: center;
        height: 200px;
        font-size: 16px;
        color: #6b7280;
      }

      .spinner {
        width: 20px;
        height: 20px;
        border: 2px solid #e5e7eb;
        border-top: 2px solid #0ba5ec;
        border-radius: 50%;
        margin-right: 12px;
        animation: spin 1s linear infinite;
      }

      @keyframes spin {
        0% { transform: rotate(0deg); }
        100% { transform: rotate(360deg); }
      }

      /* Error State */
      .error {
        display: flex;
        justify-content: center;
        align-items: center;
        height: 200px;
        font-size: 16px;
        color: #dc2626;
        flex-direction: column;
        gap: 12px;
      }

      .retry-btn {
        background: #0ba5ec;
        color: white;
        border: none;
        padding: 8px 16px;
        border-radius: 6px;
        cursor: pointer;
      }

      /* Package Grid */
      .packages-grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
        gap: 24px;
        margin: 0 auto;
      }

      .package-card {
        background: white;
        border: 1px solid #e4e7ec;
        border-radius: 12px;
        padding: 24px;
        text-align: center;
        transition: all 0.2s ease;
        cursor: pointer;
      }

      .package-card:hover {
        border-color: #1e9cfa;
        box-shadow: 0 4px 12px rgba(30, 156, 250, 0.15);
      }

      .package-image {
        margin: 0 auto 24px;
        background: #f4f4f4;
        border-radius: 8px;
        display: flex;
        align-items: center;
        justify-content: center;
        overflow: hidden;
        height: 200px;
      }

      .package-image img {
        width: 100%;
        height: 100%;
        object-fit: contain;
      }

      .package-name {
        font-size: 20px;
        font-weight: 600;
        color: #111827;
        margin-bottom: 8px;
        text-align: left;
      }

      .package-price {
        font-size: 18px;
        color: #6b7280;
        margin-bottom: 20px;
        text-align: left;
      }

      .proceed-btn {
        background: #0086c9;
        color: white;
        border: none;
        padding: 12px 24px;
        border-radius: 8px;
        font-size: 14px;
        font-weight: 600;
        cursor: pointer;
        width: 100%;
        margin-bottom: 12px;
        transition: background 0.2s ease;
      }

      .proceed-btn:hover {
        background: #0284c7;
      }

      .view-benefits {
        background: none;
        border: none;
        color: #475467;
        font-size: 14px;
        cursor: pointer;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 4px;
        width: 100%;
        padding: 8px;
      }

      .benefits-section {
        display: none;
        padding: 20px 0 0 0;
        border-top: 1px solid #e4e7ec;
        margin-top: 20px;
      }

      .benefits-section.expanded {
        display: block;
      }

      .benefits-title {
        font-size: 16px;
        font-weight: 600;
        color: #111827;
        margin-bottom: 16px;
        text-align: left;
      }

      .benefits-list {
        list-style: none;
        padding: 0;
        margin: 0;
      }

      .benefit-item {
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 6px 0;
        font-size: 14px;
        color: #475467;
        text-align: left;
      }

      .benefit-icon {
        width: 16px;
        height: 16px;
        border: 1px solid #0086c9;
        border-radius: 50%;
        display: flex;
        align-items: center;
        justify-content: center;
        flex-shrink: 0;
      }

      .benefit-icon::after {
        content: "✓";
        color: #0086c9;
        font-size: 10px;
        font-weight: bold;
      }

      /* Footer Navigation */
      .footer-nav {
        background: white;
        padding: 16px 24px;
        border-top: 1px solid #e5e7eb;
        display: flex;
        justify-content: space-between;
        align-items: center;
        max-width: 1280px;
        margin: 10px auto;
        border-radius: 16px;
      }

      .back-btn {
        background: none;
        border: none;
        color: #6b7280;
        font-size: 14px;
        cursor: pointer;
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 8px 16px;
      }

      .save-btn {
        background: #f3f4f6;
        border: none;
        color: #6b7280;
        font-size: 14px;
        padding: 8px 24px;
        border-radius: 6px;
        cursor: pointer;
      }

      /* Responsive Design */
      @media (max-width: 768px) {
        .header {
          padding: 12px 16px;
        }

        .progress-container {
          padding: 16px;
        }

        .progress-steps {
          gap: 16px;
        }

        .step-icon {
          width: 40px;
          height: 40px;
        }

        .step-label {
          font-size: 12px;
        }

        .main-content {
          padding: 24px 16px;
        }

        .page-title {
          font-size: 24px;
        }

        .packages-grid {
          grid-template-columns: 1fr;
          gap: 16px;
        }

        .package-card {
          padding: 20px;
        }

        .package-image {
          height: 150px;
        }

        .footer-nav {
          padding: 16px;
        }
      }
    </style>
  </head>
  <body>
    <!-- Header -->
    <div class="header">
      <div class="logo">
        <div class="logo-icon">
          <span style="font-size: 20px;">📦</span>
        </div>
        <span>Ezra</span>
      </div>
      <div class="header-actions">
        <div class="user-avatar">MM</div>
      </div>
    </div>

    <!-- Progress Steps -->
    <div class="progress-container">
      <div class="progress-steps">
        <div class="step active">
          <div class="step-icon">
            <span>📦</span>
          </div>
          <div class="step-label">Choose Package</div>
        </div>
        <div class="step">
          <div class="step-icon">
            <span>🛒</span>
          </div>
          <div class="step-label">Cart & Customization</div>
        </div>
        <div class="step">
          <div class="step-icon">
            <span>📄</span>
          </div>
          <div class="step-label">Invoice</div>
        </div>
      </div>
    </div>

    <!-- Main Content -->
    <div class="main-content">
      <div class="content-wrapper">
        <h1 class="page-title">Choose your package</h1>
        <p class="page-subtitle">Select your package from the list below.</p>

        <!-- Loading State -->
        <div id="loading" class="loading">
          <div class="spinner"></div>
          Loading packages...
        </div>

        <!-- Error State -->
        <div id="error" class="error" style="display: none;">
          <div>Failed to load packages. Please try again.</div>
          <button class="retry-btn" onclick="loadProducts()">Retry</button>
        </div>

        <!-- Products Grid -->
        <div id="packages-grid" class="packages-grid" style="display: none;">
          <!-- Products will be dynamically loaded here -->
        </div>
      </div>
    </div>

    <!-- Footer Navigation -->
    <div class="footer-nav">
      <button class="back-btn">← Back</button>
      <button class="save-btn">Save</button>
    </div>

    <script>
      // Global state management
      const AppState = {
        products: [],
        selectedProduct: null,
        extras: [],
        selectedExtras: [],
        orderTotal: 0
      };

      // API Configuration
      const API_CONFIG = {
        baseUrl: 'https://fff.sandbox.api.ezra360.com/api/v1.0/entities/ExecuteRequest',
        apiKey: 'TPiNa.aoAj0IkST3vQlyM9BRPiKphXmXSIxinKB8mPXSbnx5U',
        recordId: '41822ddd-155b-4470-9aed-dddf5219c6d5'
      };

      // API Functions
      async function fetchProducts() {
        const myHeaders = new Headers();
        myHeaders.append("api-key", API_CONFIG.apiKey);
        myHeaders.append("Content-Type", "application/json");

        const raw = JSON.stringify({
          "entityName": "ProductGroup",
          "requestName": "ProductGroupListingExecuteRequest"
        });

        const requestOptions = {
          method: "POST",
          headers: myHeaders,
          body: raw,
          redirect: "follow"
        };

        try {
          const response = await fetch(API_CONFIG.baseUrl, requestOptions);
          const result = await response.json();
          
          if (result.isSuccess && result.outputParameters) {
            return result.outputParameters.ProductGroupData || [];
          } else {
            throw new Error('Failed to fetch products');
          }
        } catch (error) {
          console.error('Error fetching products:', error);
          throw error;
        }
      }

      // UI Functions
      function showLoading() {
        document.getElementById('loading').style.display = 'flex';
        document.getElementById('error').style.display = 'none';
        document.getElementById('packages-grid').style.display = 'none';
      }

      function showError() {
        document.getElementById('loading').style.display = 'none';
        document.getElementById('error').style.display = 'flex';
        document.getElementById('packages-grid').style.display = 'none';
      }

      function showProducts() {
        document.getElementById('loading').style.display = 'none';
        document.getElementById('error').style.display = 'none';
        document.getElementById('packages-grid').style.display = 'grid';
      }

      function formatPrice(price) {
        return `R${parseFloat(price || 0).toLocaleString()}`;
      }

      function createProductCard(product) {
        const benefits = product.benefits ? product.benefits.split(', ') : [];
        const hasImage = product.url && product.url.trim() !== '';
        
        return `
          <div class="package-card" data-product-id="${product.productGroupId}">
            <div class="package-image">
              ${hasImage 
                ? `<img src="${product.url}" alt="${product.productGroupName}" onerror="this.style.display='none';" />` 
                : `<div style="color: #9ca3af; font-size: 48px;">📦</div>`
              }
            </div>
            <h3 class="package-name">${product.productGroupName}</h3>
            <p class="package-price">${formatPrice(product.price)}</p>
            <button class="proceed-btn" onclick="proceedToCart('${product.productGroupId}')">
              Proceed to cart
            </button>
            ${benefits.length > 0 ? `
              <button class="view-benefits" onclick="toggleBenefits('${product.productGroupId}')">
                View Benefits
              </button>
              <div class="benefits-section" id="benefits-${product.productGroupId}">
                <h4 class="benefits-title">Benefits</h4>
                <ul class="benefits-list">
                  ${benefits.map(benefit => `
                    <li class="benefit-item">
                      <div class="benefit-icon"></div>
                      <span>${benefit.trim()}</span>
                    </li>
                  `).join('')}
                </ul>
              </div>
            ` : ''}
          </div>
        `;
      }

      function renderProducts(products) {
        const grid = document.getElementById('packages-grid');
        grid.innerHTML = products.map(product => createProductCard(product)).join('');
      }

      // Event Handlers
      function toggleBenefits(productId) {
        const benefitsSection = document.getElementById(`benefits-${productId}`);
        const isExpanded = benefitsSection.classList.contains('expanded');
        
        // Close all other expanded sections
        document.querySelectorAll('.benefits-section.expanded').forEach(section => {
          section.classList.remove('expanded');
        });
        
        // Toggle current section
        if (!isExpanded) {
          benefitsSection.classList.add('expanded');
        }
      }

      function proceedToCart(productId) {
        const product = AppState.products.find(p => p.productGroupId === productId);
        if (product) {
          AppState.selectedProduct = product;
          
          // Store selected product in localStorage for next page
          localStorage.setItem('selectedProduct', JSON.stringify(product));
          
          // Navigate to cart page
          window.location.href = 'cart.html';
        }
      }

      // Main loading function
      async function loadProducts() {
        showLoading();
        
        try {
          const products = await fetchProducts();
          AppState.products = products;
          renderProducts(products);
          showProducts();
        } catch (error) {
          console.error('Failed to load products:', error);
          showError();
        }
      }

      // Initialize the page
      document.addEventListener('DOMContentLoaded', () => {
        loadProducts();
      });

      // Footer button handlers
      document.querySelector('.back-btn').addEventListener('click', () => {
        // Navigate to previous page or home
        window.history.back();
      });

      document.querySelector('.save-btn').addEventListener('click', () => {
        // Save current state
        localStorage.setItem('appState', JSON.stringify(AppState));
        alert('State saved successfully!');
      });
    </script>
  </body>
</html>
