<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Choose Package</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
          Oxygen, Ubuntu, Cantarell, sans-serif;
        background-color: #f9fafb;
        color: #333;
      }

      /* Header */
      .header {
        background: #fff;
        color: black;
        padding: 12px 24px;
        display: flex;
        align-items: center;
        justify-content: center;
        box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
      }

      .header h1 {
        font-size: 20px;
      }

      .logo {
        display: flex;
        align-items: center;
        gap: 8px;
        font-weight: 600;
        font-size: 16px;
      }

      .logo-icon {
        width: 40px;
        height: 40px;
        border-radius: 8px;
        display: flex;
        align-items: center;
        justify-content: center;
      }

      .search-container {
        flex: 1;
        max-width: 400px;
        margin: 0 24px;
        position: relative;
      }

      .search-input {
        width: 100%;
        padding: 10px 40px 10px 16px;
        border: none;
        border-radius: 8px;
        font-size: 14px;
        background: white;
        outline: none;
      }

      .search-icon {
        position: absolute;
        right: 12px;
        top: 50%;
        transform: translateY(-50%);
        color: #666;
      }

      .header-actions {
        display: flex;
        align-items: center;
        gap: 16px;
      }

      .quick-create {
        background: white;
        border: 1px solid rgba(255, 255, 255, 0.3);
        color: black;
        padding: 8px 16px;
        border-radius: 6px;
        font-size: 14px;
        cursor: pointer;
        display: flex;
        align-items: center;
        gap: 6px;
      }

      .user-avatar {
        width: 32px;
        height: 32px;
        background: white;
        border-radius: 50%;
        color: black;
        display: flex;
        align-items: center;
        justify-content: center;
        font-weight: 600;
        font-size: 14px;
        cursor: pointer;
      }

      /* Progress Steps */
      .progress-container {
        background: white;
        padding: 24px;
        border-bottom: 1px solid #e5e7eb;
        max-width: 1280px;
        margin: 10px auto;
        border-radius: 16px;
      }

      .progress-steps {
        display: flex;
        justify-content: center;
        align-items: center;
        max-width: 600px;
        margin: 0 auto;
      }

      .step {
        display: flex;
        flex-direction: column;
        align-items: center;
        text-align: center;
        flex: 1;
        position: relative;
      }

      .step:not(:last-child)::after {
        content: "";
        position: absolute;
        top: 24px;
        right: -50%;
        width: 100%;
        height: 2px;
        background: #e5e7eb;
        z-index: 1;
      }

      .step-icon {
        width: 48px;
        height: 48px;
        border-radius: 12px;
        background: #fff;
        display: flex;
        align-items: center;
        justify-content: center;
        margin-bottom: 12px;
        position: relative;
        z-index: 2;
        font-size: 20px;
        color: #9ca3af;
        border: 1px solid #e4e7ec;
      }

      .step-label {
        font-size: 14px;
        color: #6b7280;
        font-weight: 500;
      }

      .step.active .step-label {
        color: #344054;
      }

      /* Main Content */
      .main-content {
        background: white;
        padding: 32px 24px;
        min-height: calc(100vh - 200px);
        max-width: 1280px;
        margin: 10px auto;
        border-radius: 16px;
      }

      .content-wrapper {
        max-width: 1200px;
        margin: 0 auto;
      }

      .page-title {
        font-size: 30px;
        font-weight: 700;
        color: #1a1a1a;
        margin-bottom: 8px;
      }

      .page-subtitle {
        font-size: 18px;
        color: #1a1a1a;
        font-weight: 400;
        margin-bottom: 48px;
      }

      /* Package Grid */
      .packages-grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
        gap: 24px;
        margin: 0 auto;
      }

      .package-card {
        background: white;
        border: 1px solid #e4e7ec;
        border-radius: 12px;
        padding: 24px;
        text-align: center;
        transition: all 0.2s ease;
        cursor: pointer;
      }

      .package-card:hover {
        border-color: #1e9cfa;
        box-shadow: 0 4px 12px rgba(30, 156, 250, 0.15);
      }

      .package-image {
        margin: 0 auto 24px;
        background: #f4f4f4;
        border-radius: 8px;
        display: flex;
        align-items: center;
        justify-content: center;
        overflow: hidden;
        width: 210px;
        height: 210px;
      }

      .package-image img {
        width: 100%;
        height: 100%;
        object-fit: contain;
        border-radius: 8px;
      }

      .package-image-placeholder {
        width: 100%;
        height: 100%;
        background: #f3f4f6;
        border-radius: 8px;
        display: flex;
        align-items: center;
        justify-content: center;
        color: #9ca3af;
        font-size: 16px;
        text-align: center;
      }

      .package-name {
        font-size: 20px;
        font-weight: 600;
        color: #111827;
        margin-bottom: 8px;
        justify-self: left;
      }

      .package-price {
        font-size: 18px;
        color: #6b7280;
        margin-bottom: 20px;
        justify-self: left;
      }

      .proceed-btn {
        background: #0086c9;
        color: white;
        border: none;
        padding: 12px 24px;
        border-radius: 8px;
        font-size: 14px;
        font-weight: 600;
        cursor: pointer;
        width: 100%;
        margin-bottom: 12px;
        transition: background 0.2s ease;
      }

      .proceed-btn:hover {
        background: #0284c7;
      }

      .view-benefits {
        background: none;
        border: none;
        color: #475467;
        font-size: 14px;
        cursor: pointer;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 4px;
        width: 100%;
        padding: 8px;
      }

      /* Footer Navigation */
      .footer-nav {
        background: white;
        padding: 16px 24px;
        border-top: 1px solid #e5e7eb;
        display: flex;
        justify-content: space-between;
        align-items: center;
        max-width: 1280px;
        margin: 10px auto;
        border-radius: 16px;
      }

      .back-btn {
        background: #f3f4f6;
        border: none;
        color: #6b7280;
        font-size: 14px;
        padding: 8px 24px;
        border-radius: 6px;
        cursor: not-allowed;
      }

      .save-btn {
        background: #0086c9;
        border: none;
        color: white;
        font-size: 14px;
        padding: 8px 24px;
        border-radius: 6px;
        cursor: pointer;
      }

      /* Responsive Design */
      @media (max-width: 768px) {
        .header {
          padding: 12px 16px;
        }

        .search-container {
          margin: 0 16px;
          max-width: none;
        }

        .progress-container {
          padding: 16px;
        }

        .progress-steps {
          gap: 16px;
        }

        .step-icon {
          width: 40px;
          height: 40px;
        }

        .step-label {
          font-size: 12px;
        }

        .main-content {
          padding: 24px 16px;
        }

        .page-title {
          font-size: 24px;
        }

        .packages-grid {
          grid-template-columns: 1fr;
          gap: 16px;
        }

        .package-card {
          padding: 20px;
        }

        .package-image {
          width: 150px;
          height: 100px;
        }

        .footer-nav {
          padding: 16px;
        }
      }

      @media (max-width: 480px) {
        .header-actions .quick-create span {
          display: none;
        }

        .search-input {
          font-size: 16px; /* Prevents zoom on iOS */
        }

        .page-subtitle {
          margin-bottom: 32px;
        }

        .package-image {
          width: 120px;
          height: 80px;
        }

        .proceed-btn {
          padding: 14px 24px;
          font-size: 16px;
          background-color: #0086c9;
        }
      }

      .benefits-section {
        display: none;
        padding: 20px 0 0 0;
        border-top: 1px solid #e4e7ec;
        margin-top: 20px;
      }

      .benefits-section.expanded {
        display: block;
      }

      .benefits-title {
        font-size: 16px;
        font-weight: 600;
        color: #111827;
        margin-bottom: 16px;
        text-align: left;
      }

      .benefits-list {
        list-style: none;
        padding: 0;
        margin: 0;
      }

      .benefit-item {
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 6px 0;
        font-size: 14px;
        color: #475467;
        text-align: left;
      }

      .benefit-icon {
        width: 16px;
        height: 16px;
        border: 1px solid #0086c9;
        border-radius: 50%;
        display: flex;
        align-items: center;
        justify-content: center;
        flex-shrink: 0;
      }

      .benefit-icon::after {
        content: "✓";
        color: #0086c9;
        font-size: 10px;
        font-weight: bold;
      }

      .view-benefits {
        transition: transform 0.2s ease;
      }

      /* Loading state */
      .loading {
        display: flex;
        justify-content: center;
        align-items: center;
        height: 200px;
        color: #6b7280;
      }

      /* Error state */
      .error {
        display: flex;
        justify-content: center;
        align-items: center;
        height: 200px;
        color: #dc2626;
        text-align: center;
      }

      /* Modal Styles */
      .modal {
        display: none;
        position: fixed;
        z-index: 1000;
        left: 0;
        top: 0;
        width: 100%;
        height: 100%;
        background-color: rgba(0, 0, 0, 0.5);
      }

      .modal-content {
        background-color: white;
        margin: 15% auto;
        padding: 0;
        border-radius: 12px;
        width: 400px;
        max-width: 90%;
        box-shadow: 0 10px 25px rgba(0, 0, 0, 0.2);
      }

      .modal-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 24px 24px 0 24px;
      }

      .modal-icon {
        width: 48px;
        height: 48px;
        background: #fef3c7;
        border-radius: 50%;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 24px;
      }

      .modal-icon svg {
        color: #dc6803;
      }

      .modal-close {
        background: none;
        border: none;
        font-size: 24px;
        cursor: pointer;
        color: #9ca3af;
        padding: 0;
        width: 24px;
        height: 24px;
      }

      .modal-body {
        padding: 16px 24px 24px;
      }

      .modal-body h3 {
        font-size: 18px;
        font-weight: 600;
        color: #111827;
        margin-bottom: 8px;
      }

      .modal-body p {
        font-size: 14px;
        color: #6b7280;
        line-height: 1.5;
      }

      .modal-buttons {
        display: flex;
        gap: 12px;
        padding: 0 24px 24px;
      }

      .modal-btn-primary {
        background: #0086c9;
        color: white;
        border: none;
        padding: 12px 24px;
        border-radius: 8px;
        font-size: 14px;
        font-weight: 600;
        cursor: pointer;
        flex: 1;
      }

      .modal-btn-primary:hover {
        background: #0284c7;
      }

      .modal-btn-secondary {
        background: white;
        color: #374151;
        border: 1px solid #d1d5db;
        padding: 12px 24px;
        border-radius: 8px;
        font-size: 14px;
        font-weight: 600;
        cursor: pointer;
        flex: 1;
      }

      .modal-btn-secondary:hover {
        background: #f9fafb;
      }
    </style>
  </head>
  <body>
    <!-- Header -->
    <div class="header">
      <div class="">
        <h1 id="burial-header">Burial Planning</h1>
      </div>
    </div>

    <!-- Progress Steps -->
    <div class="progress-container">
      <div class="progress-steps">
        <div class="step active">
          <div class="step-icon">
            <img
              src="/WebResource?id=package"
              width="24"
              height="24"
              alt="Package Icon"
            />
          </div>
          <div class="step-label">Choose Package</div>
        </div>
        <div class="step">
          <div class="step-icon">
            <img
              src="/WebResource?id=shopping-bag-03"
              width="24"
              height="24"
              alt="Package Icon"
            />
          </div>
          <div class="step-label">Cart & Customization</div>
        </div>
        <div class="step">
          <div class="step-icon">
            <img
              src="/WebResource?id=file-check-02"
              width="24"
              height="24"
              alt="Package Icon"
            />
          </div>
          <div class="step-label">Invoice</div>
        </div>
      </div>
    </div>

    <!-- Main Content -->
    <div class="main-content">
      <div class="content-wrapper">
        <h1 class="page-title">Choose your package</h1>
        <p class="page-subtitle">Select your package from the list below.</p>

        <div id="packages-container">
          <div class="loading">Loading packages...</div>
        </div>
      </div>
    </div>

    <!-- Footer Navigation -->
    <div class="footer-nav">
      <button class="back-btn">← Back</button>
      <button class="save-btn">Save</button>
    </div>

    <!-- Save Modal -->
    <div id="save-modal" class="modal" style="display: none">
      <div class="modal-content">
        <div class="modal-header">
          <div class="modal-icon">
            <svg
              xmlns="http://www.w3.org/2000/svg"
              width="24"
              height="24"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
              class="lucide lucide-circle-alert-icon lucide-circle-alert"
            >
              <circle cx="12" cy="12" r="10" />
              <line x1="12" x2="12" y1="8" y2="12" />
              <line x1="12" x2="12.01" y1="16" y2="16" />
            </svg>
          </div>
          <button class="modal-close" onclick="closeSaveModal()">
            &times;
          </button>
        </div>
        <div class="modal-body">
          <h3>Saving Order</h3>
          <p>Are you sure you want to save this order to continue later?</p>
        </div>
        <div class="modal-buttons">
          <button class="modal-btn-primary" onclick="confirmSave()">
            Yes, Save
          </button>
          <button class="modal-btn-secondary" onclick="closeSaveModal()">
            No, Continue
          </button>
        </div>
      </div>
    </div>

    <script>
      // API Configuration
      const API_BASE_URL = "https://mib.sandbox.api.ezra360.com/api/v1.0";
      const API_KEY = "1bcTCI.pWzRtox0PIXllAvT0hrPd0Sz32FvlhBIxBKgouivzfx";

      // Global variables
      let allPackages = [];
      let urlParams = {}; // Add this line
      let burialId = ""; // Will be extracted from URL parameters

      // Function to extract URL parameters
      function getUrlParameters() {
        const params = {};
        let currentUrl = window.location.href;

        // Try to get the parent URL if we're in an iframe/nested context
        try {
          if (
            window.parent &&
            window.parent !== window &&
            window.parent.location
          ) {
            currentUrl = window.parent.location.href;
          }
        } catch (e) {
          // Cross-origin restriction - try alternative methods
          console.log(
            "Cannot access parent URL due to cross-origin restrictions"
          );
        }

        // Alternative: Check if referrer contains our parameters
        if (document.referrer && document.referrer.includes("title=")) {
          currentUrl = document.referrer;
        }

        // Debug logging
        console.log("Current page URL:", window.location.href);
        console.log("Parent/Referrer URL:", currentUrl);
        console.log("Document referrer:", document.referrer);

        try {
          // Method 1: Parse current page parameters
          const urlSearchParams = new URLSearchParams(window.location.search);
          for (const [key, value] of urlSearchParams) {
            params[key] = decodeURIComponent(value);
          }

          // Method 2: Parse from the full URL (parent or referrer)
          const titleMatch = currentUrl.match(/[?&]title=([^&]+)/);
          const burialIdMatch = currentUrl.match(/[?&]burialId=([^&]+)/);

          if (titleMatch) {
            try {
              params.title = decodeURIComponent(titleMatch[1]);
            } catch (e) {
              params.title = titleMatch[1];
            }
          }

          if (burialIdMatch) {
            try {
              params.burialId = decodeURIComponent(burialIdMatch[1]);
            } catch (e) {
              params.burialId = burialIdMatch[1];
            }
          }

          // Method 3: Try to parse from hash if parameters are there
          if (window.location.hash) {
            const hashParams = window.location.hash.substring(1);
            const hashUrlParams = new URLSearchParams(hashParams);
            for (const [key, value] of hashUrlParams) {
              params[key] = decodeURIComponent(value);
            }
          }
        } catch (error) {
          console.error("Error parsing URL parameters:", error);
        }

        return params;
      }

      // Function to extract burial ID and name from title parameter
      function parseTitle(title) {
        if (!title) return { burialId: "", name: "" };

        // Expected format: "B001665 - Thabiso Zungu"
        const parts = title.split(" - ");
        if (parts.length >= 2) {
          return {
            burialId: parts[0].trim(),
            name: parts.slice(1).join(" - ").trim(), // Join back in case there are multiple dashes
          };
        }

        // Fallback: if format is different, try to extract what we can
        return {
          burialId: parts[0] || "",
          name: title,
        };
      }

      // Function to update the header with extracted information
      function updateHeader() {
        urlParams = getUrlParameters();
        const headerElement = document.getElementById("burial-header");

        // Always use the burialId parameter from URL for API calls
        if (urlParams.burialId) {
          burialId = urlParams.burialId; // Use the actual burialId parameter for API
        }

        // Extract name from title for display, regardless of which burialId we use
        let displayName = "Unknown";
        let displayBurialId = urlParams.burialId || "Unknown";

        if (urlParams.title) {
          const { burialId: extractedBurialId, name } = parseTitle(
            urlParams.title
          );
          if (name) {
            displayName = name;
          }
          // Use the extracted burialId from title for display (B001681)
          if (extractedBurialId) {
            displayBurialId = extractedBurialId;
          }
        }

        headerElement.textContent = `Burial Planning of: ${displayName} (${displayBurialId})`;

        // Log extracted parameters for debugging
        console.log("Extracted URL Parameters:", urlParams);
        console.log("Extracted BurialId:", burialId);
        console.log(
          "Parsed title:",
          urlParams.title ? parseTitle(urlParams.title) : "No title parameter"
        );
      }

      // Fetch packages from API
      async function fetchPackages() {
        try {
          console.log("Fetching packages with burialId:", burialId);
          const myHeaders = new Headers();
          myHeaders.append("api-key", API_KEY);
          myHeaders.append("Content-Type", "application/json");

          const raw = JSON.stringify({
            entityName: "ProductGroup",
            requestName: "ProductGroupListingExecuteRequest",
            inputParamters: {
              ProductData: {
                BurialId: burialId,
              },
            },
          });

          const requestOptions = {
            method: "POST",
            headers: myHeaders,
            body: raw,
            redirect: "follow",
          };

          const response = await fetch(
            `${API_BASE_URL}/entities/ExecuteRequest`,
            requestOptions
          );
          const result = await response.json();

          if (
            result.isSuccess &&
            result.outputParameters &&
            result.outputParameters.ProductGroupData
          ) {
            return result.outputParameters.ProductGroupData;
          } else {
            throw new Error("Failed to fetch packages");
          }
        } catch (error) {
          console.error("Error fetching packages:", error);
          throw error;
        }
      }

      // Format price for display
      function formatPrice(price) {
        if (price === 0 || price === 0.0) {
          return "Contact for Price";
        }
        return `R${price.toLocaleString()}`;
      }

      // Parse benefits string into array
      function parseBenefits(benefitsString) {
        if (!benefitsString) return [];
        return benefitsString
          .split(",")
          .map((benefit) => benefit.trim())
          .filter((benefit) => benefit.length > 0);
      }

      // Create package card HTML
      function createPackageCard(packageData, index) {
        const benefits = parseBenefits(packageData.benefits);
        const imageUrl = Array.isArray(packageData.url)
          ? packageData.url[0]
          : packageData.url;
        const hasImage = imageUrl && imageUrl.trim() !== "";

        return `
          <div class="package-card" data-package-id="${
            packageData.productGroupId
          }">
            <div class="package-image">
              ${
                hasImage
                  ? `<img
                  src="${imageUrl}"
                  alt="${packageData.productGroupName}"
                  onerror="this.parentElement.innerHTML='<div class=&quot;package-image-placeholder&quot;>No Image Available</div>'"
                />`
                  : `<div class="package-image-placeholder">No Image Available</div>`
              }
            </div>
            <h3 class="package-name">${packageData.productGroupName}</h3>
            <p class="package-price">${formatPrice(packageData.price)}</p>
            <button class="proceed-btn" data-package-id="${
              packageData.productGroupId
            }">Proceed to cart</button>
            ${
              benefits.length > 0
                ? `
              <button class="view-benefits" data-package="package-${index}">
                View Benefits
              </button>
              <div class="benefits-section" id="benefits-package-${index}">
                <h4 class="benefits-title">Benefits</h4>
                <ul class="benefits-list">
                  ${benefits
                    .map(
                      (benefit) => `
                    <li class="benefit-item">
                      <div class="benefit-icon"></div>
                      <span>${benefit}</span>
                    </li>
                  `
                    )
                    .join("")}
                </ul>
              </div>
            `
                : ""
            }
          </div>
        `;
      }

      // Render packages
      function renderPackages(packages) {
        const container = document.getElementById("packages-container");

        if (!packages || packages.length === 0) {
          container.innerHTML =
            '<div class="error">No packages available</div>';
          return;
        }

        const packagesGrid = `
          <div class="packages-grid">
            ${packages
              .map((packageData, index) =>
                createPackageCard(packageData, index)
              )
              .join("")}
          </div>
        `;

        container.innerHTML = packagesGrid;
        attachEventListeners();
      }

      // Show error state
      function showError(message) {
        const container = document.getElementById("packages-container");
        container.innerHTML = `<div class="error">${message}</div>`;
      }

      // Find package by ID
      function findPackageById(packageId) {
        return allPackages.find((pkg) => pkg.productGroupId === packageId);
      }

      // Attach event listeners to dynamic content
      function attachEventListeners() {
        // Proceed to cart buttons
        document.querySelectorAll(".proceed-btn").forEach((btn) => {
          btn.addEventListener("click", (e) => {
            e.stopPropagation();
            const packageId = btn.getAttribute("data-package-id");
            const packageData = findPackageById(packageId);

            if (!packageData) {
              alert("Package not found. Please try again.");
              return;
            }

            // Store selected package info in session storage for the cart page
            const selectedPackage = {
              ...packageData,
              timestamp: Date.now(),
            };
            sessionStorage.setItem(
              "selectedPackage",
              JSON.stringify(selectedPackage)
            );

            // Route to cart page
            window.location.href = "/WebResource?id=cart-cart";
          });
        });

        // View benefits buttons
        document.querySelectorAll(".view-benefits").forEach((btn) => {
          btn.addEventListener("click", (e) => {
            e.stopPropagation();
            const packageType = btn.getAttribute("data-package");
            const benefitsSection = document.getElementById(
              `benefits-${packageType}`
            );

            if (!benefitsSection) return;

            if (benefitsSection.classList.contains("expanded")) {
              benefitsSection.classList.remove("expanded");
              btn.classList.remove("expanded");
            } else {
              // Close all other expanded sections
              document
                .querySelectorAll(".benefits-section.expanded")
                .forEach((section) => {
                  section.classList.remove("expanded");
                });
              document
                .querySelectorAll(".view-benefits.expanded")
                .forEach((button) => {
                  button.classList.remove("expanded");
                });

              // Open clicked section
              benefitsSection.classList.add("expanded");
              btn.classList.add("expanded");
            }
          });
        });
      }

      // Initialize the page
      async function initializePage() {
        // First update the header with URL parameters
        updateHeader();

        try {
          allPackages = await fetchPackages();
          renderPackages(allPackages);
        } catch (error) {
          showError("Failed to load packages. Please try again later.");
        }
      }

      // Footer navigation
      document.querySelector(".back-btn").addEventListener("click", () => {
        // Navigate back to previous page
        window.history.back();
      });

      // Add these new functions:
      function closeSaveModal() {
        document.getElementById("save-modal").style.display = "none";
      }

      function confirmSave() {
        // Save current selections
        // const orderData = {
        //   basePackage: {
        //     name: basePackageName,
        //     price: basePackagePrice
        //   },
        //   extras: selectedExtras,
        //   total: calculateTotal(),
        //   timestamp: Date.now()
        // };
        // sessionStorage.setItem('orderData', JSON.stringify(orderData));

        // Redirect to /cart
        window.parent.location.href =
          "https://mib.sandbox.ezra360.com/Entity/List/Burial?mod=BurialServices";
      }

      // Close modal when clicking outside of it
      window.onclick = function (event) {
        const modal = document.getElementById("save-modal");
        if (event.target == modal) {
          closeSaveModal();
        }
      };

      // Replace the existing save button handler with this:
      document.querySelector(".save-btn").addEventListener("click", () => {
        // Show the save modal
        document.getElementById("save-modal").style.display = "block";
      });

      // Start the application
      document.addEventListener("DOMContentLoaded", initializePage);
    </script>
  </body>
