<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Order Completed</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background-color: #f5f5f5;
            color: #333;
            min-height: 100vh;
        }

        /* Header */
        .header {
            background: linear-gradient(135deg, #1e9cfa 0%, #0ea5e9 100%);
            color: white;
            padding: 12px 24px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 8px;
            font-weight: 600;
            font-size: 16px;
        }

        .logo-icon {
            width: 32px;
            height: 32px;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .search-container {
            flex: 1;
            max-width: 400px;
            margin: 0 24px;
            position: relative;
        }

        .search-input {
            width: 100%;
            padding: 10px 40px 10px 16px;
            border: none;
            border-radius: 8px;
            font-size: 14px;
            background: white;
            outline: none;
        }

        .search-icon {
            position: absolute;
            right: 12px;
            top: 50%;
            transform: translateY(-50%);
            color: #666;
        }

        .header-actions {
            display: flex;
            align-items: center;
            gap: 16px;
        }

        .quick-create {
            background: rgba(255, 255, 255, 0.15);
            border: 1px solid rgba(255, 255, 255, 0.3);
            color: white;
            padding: 8px 16px;
            border-radius: 6px;
            font-size: 14px;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 6px;
        }

       .user-avatar {
            width: 32px;
            height: 32px;
            background: white;
            border-radius: 50%;
            color: black;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 600;
            font-size: 14px;
            cursor: pointer;
        }
        /* Progress Steps */
        .progress-container {
            background: white;
            padding: 24px;
            border-bottom: 1px solid #e5e7eb;
        }

        .progress-steps {
            display: flex;
            justify-content: center;
            align-items: center;
            max-width: 600px;
            margin: 0 auto;
        }

        .step {
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            flex: 1;
            position: relative;
        }

        .step:not(:last-child)::after {
            content: '';
            position: absolute;
            top: 24px;
            right: -50%;
            width: 100%;
            height: 2px;
            background: #1e9cfa;
            z-index: 1;
        }

        .step-icon {
            width: 48px;
            height: 48px;
            border-radius: 8px;
            background: #1e9cfa;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 12px;
            position: relative;
            z-index: 2;
            font-size: 20px;
            color: white;
        }

        .step-label {
            font-size: 14px;
            color: #1e9cfa;
            font-weight: 500;
        }

        /* Main Content */
        .main-content {
            background: white;
            min-height: calc(100vh - 60px);
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 48px 24px;
        }

        .success-container {
            text-align: center;
            max-width: 500px;
            margin: 0 auto;
        }

        .success-icon {
            width: 60px;
            height: 60px;
            background: #dcfce7;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 20px;
            position: relative;
        }

        .success-icon::after {
            content: '✓';
            color: #16a34a;
            font-size: 36px;
            font-weight: bold;
        }

        .success-title {
            font-size: 30px;
            font-weight: 700;
            color: #101828;
            margin-bottom: 10px;
        }

        .success-message {
            color: #475467;
            font-size: 14px;
            line-height: 1.6;
            margin-bottom: 20px;
        }

        .package-name {
            font-weight: 600;
            color: #111827;
        }

        .home-btn {
            background: #0086C9;
            color: white;
            border: none;
            padding: 14px 32px;
            border-radius: 10px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s ease;
            min-width: 300px;
        }

        .home-btn:hover {
            background: #0086C9;
        }

        /* Responsive Design */
        @media (max-width: 768px) {
            .header {
                padding: 12px 16px;
            }

            .search-container {
                margin: 0 16px;
                max-width: none;
            }

            .progress-container {
                padding: 16px;
            }

            .step-icon {
                width: 40px;
                height: 40px;
            }

            .step-label {
                font-size: 12px;
            }

            .main-content {
                padding: 32px 16px;
            }

            .success-title {
                font-size: 28px;
            }

            .success-icon {
                width: 70px;
                height: 70px;
                margin-bottom: 24px;
            }

            .success-icon::after {
                font-size: 30px;
            }
        }

        @media (max-width: 480px) {
            .header-actions .quick-create span {
                display: none;
            }

            .success-title {
                font-size: 24px;
            }

            .success-message {
                font-size: 15px;
                margin-bottom: 32px;
            }

            .home-btn {
                padding: 12px 24px;
                font-size: 15px;
                min-width: 180px;
            }
        }
    </style>
</head>
<body>
    <!-- Header -->
    <div class="header">
        <div class="logo">
            <div class="logo-icon">
                <img src="/assets/Small.png" alt="Logo" width="24" height="24">
            </div>
            <span>Ezra</span>
        </div>
       
        <div class="header-actions">
          
            <div class="user-avatar">MM</div>
        </div>
    </div>

    <!-- Main Content -->
    <div class="main-content">
        <div class="success-container">
            <div class="success-icon"></div>
            <h1 class="success-title">Order Completed</h1>
            <p class="success-message">
                Your order for the <span class="package-name">Kingston Maluti Package</span> has been<br>
                submitted successfully.
            </p>
            <button class="home-btn" onclick="goToHome()">Back to Home</button>
        </div>
    </div>

    <script>
        function goToHome() {
            alert('Redirecting to home page');
            // In a real application, this would navigate to the home page
            // window.location.href = '/';
        }

        document.querySelector('.quick-create').addEventListener('click', () => {
            alert('Opening Quick Create');
        });
    </script>
</body>
</html>
