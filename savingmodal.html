
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Order Completed</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background-color: #f5f5f5;
            color: #333;
            min-height: 100vh;
        }

        /* Header */
        .header {
            background: linear-gradient(135deg, #1e9cfa 0%, #0ea5e9 100%);
            color: white;
            padding: 12px 24px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 8px;
            font-weight: 600;
            font-size: 16px;
        }

        .logo-icon {
            width: 32px;
            height: 32px;
            background: rgba(255, 255, 255, 0.2);
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .search-container {
            flex: 1;
            max-width: 400px;
            margin: 0 24px;
            position: relative;
        }

        .search-input {
            width: 100%;
            padding: 10px 40px 10px 16px;
            border: none;
            border-radius: 8px;
            font-size: 14px;
            background: white;
            outline: none;
        }

        .search-icon {
            position: absolute;
            right: 12px;
            top: 50%;
            transform: translateY(-50%);
            color: #666;
        }

        .header-actions {
            display: flex;
            align-items: center;
            gap: 16px;
        }

        .quick-create {
            background: rgba(255, 255, 255, 0.15);
            border: 1px solid rgba(255, 255, 255, 0.3);
            color: white;
            padding: 8px 16px;
            border-radius: 6px;
            font-size: 14px;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .user-avatar {
            width: 32px;
            height: 32px;
            background: rgba(255, 255, 255, 0.2);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 600;
            font-size: 14px;
            cursor: pointer;
        }

        /* Progress Steps */
        .progress-container {
            background: white;
            padding: 24px;
            border-bottom: 1px solid #e5e7eb;
        }

        .progress-steps {
            display: flex;
            justify-content: center;
            align-items: center;
            max-width: 600px;
            margin: 0 auto;
        }

        .step {
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            flex: 1;
            position: relative;
        }

        .step:not(:last-child)::after {
            content: '';
            position: absolute;
            top: 24px;
            right: -50%;
            width: 100%;
            height: 2px;
            background: #1e9cfa;
            z-index: 1;
        }

        .step-icon {
            width: 48px;
            height: 48px;
            border-radius: 8px;
            background: #1e9cfa;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 12px;
            position: relative;
            z-index: 2;
            font-size: 20px;
            color: white;
        }

        .step-label {
            font-size: 14px;
            color: #1e9cfa;
            font-weight: 500;
        }

        /* Main Content */
        .main-content {
            background: white;
            min-height: calc(100vh - 140px);
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 48px 24px;
        }

        .success-container {
            text-align: center;
            max-width: 500px;
            margin: 0 auto;
        }

        .success-icon {
            width: 80px;
            height: 80px;
            background: #dcfce7;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 32px;
            position: relative;
        }

        .success-icon::after {
            content: '✓';
            color: #16a34a;
            font-size: 36px;
            font-weight: bold;
        }

        .success-title {
            font-size: 32px;
            font-weight: 700;
            color: #111827;
            margin-bottom: 16px;
            text-align: start;
        }

        .success-message {
            color: #6b7280;
            font-size: 16px;
            line-height: 1.6;
            margin-bottom: 40px;
        }

        .package-name {
            font-weight: 600;
            color: #111827;
        }

        .save-btn {
            background: #1e9cfa;
            color: white;
            border: none;
            padding: 14px 32px;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s ease;
            min-width: 200px;
        }

        .save-btn:hover {
            background: #0284c7;
        }



.Continue-btn {
  
            color: black;
            border: none;
            padding: 14px 32px;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s ease;
            min-width: 200px;
            
            border-radius: var(--radius-md, 8px);
border: 1px solid var(--Component-colors-Components-Buttons-Secondary-button-secondary-border, #D0D5DD);
background: var(--Component-colors-Components-Buttons-Secondary-button-secondary-bg, #FFF);
/* Shadows/shadow-xs-skeuomorphic */
box-shadow: 0 0 0 1px var(--Colors-Effects-Shadows-shadow-skeumorphic-inner-border, rgba(16, 24, 40, 0.18)) inset, 0 -2px 0 0 var(--Colors-Effects-Shadows-shadow-skeumorphic-inner, rgba(16, 24, 40, 0.05)) inset, 0 1px 2px 0 var(--Colors-Effects-Shadows-shadow-xs, rgba(16, 24, 40, 0.05));
        }

        .continue-btn:hover {
            background: #0284c7;
        }


        .box-grid {
             display: flex;
            align-items: flex-start;
            justify-content: space-between;
            padding: 12px;
            border: 2px solid #e5e7eb;
            border-radius: 8px;
            margin-bottom: 8px;
            cursor: pointer;
            transition: all 0.2s ease;
            width:450px;
            height: 350px;
        }



        /* Responsive Design */
        @media (max-width: 768px) {
            .header {
                padding: 12px 16px;
            }

            .search-container {
                margin: 0 16px;
                max-width: none;
            }

            .progress-container {
                padding: 16px;
            }

            .step-icon {
                width: 40px;
                height: 40px;
            }

            .step-label {
                font-size: 12px;
            }

            .main-content {
                padding: 32px 16px;
            }

            .success-title {
                font-size: 28px;
            }

            .success-icon {
                width: 70px;
                height: 70px;
                margin-bottom: 24px;
            }

            .success-icon::after {
                font-size: 30px;
            }
        }

        @media (max-width: 480px) {
            .header-actions .quick-create span {
                display: none;
            }

            .success-title {
                font-size: 24px;
            }

            .success-message {
                font-size: 15px;
                margin-bottom: 32px;
            }

            .home-btn {
                padding: 12px 24px;
                font-size: 15px;
                min-width: 180px;
            }
        }
    </style>
</head>
<body>
    <!-- Header -->
    <div class="header">
        <div class="logo">
            <div class="logo-icon">☁</div>
            <span>Company Name</span>
        </div>
        <div class="search-container">
            <input type="text" class="search-input" placeholder="Search for a page">
            <div class="search-icon">🔍</div>
        </div>
        <div class="header-actions">
            <button class="quick-create">
                <span>⊕</span>
                <span>Quick Create</span>
            </button>
            <div class="user-avatar">MM</div>
        </div>
    </div>

    <!-- Main Content -->
    <div class="main-content">
        <div class="box-grid">
        <div class="success-container">
            <div class="success-icon"></div>
            <h1 class="success-title">Saving Order</h1>
            <p class="Continue-message">
                Are you sure you want to save this order to continue later ? 
            </p>
            <button class="save-btn" >Yes,Save</button>
            <button class="Continue-btn">No,Continue</button>
        </div>
    </div>
</div>
    <script>
       
         document.querySelector('.Continue-btn').addEventListener('click', () => {
            alert('Continuing with the order...');
        });


        document.querySelector('.save-btn').addEventListener('click', () => {
            alert('Order saved successfully!');
        });
    </script>
</body>
</html>
