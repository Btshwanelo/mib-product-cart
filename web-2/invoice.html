<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cart & Customization</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background-color: #f5f5f5;
            color: #333;
        }

        /* Header */
        .header {
            background: linear-gradient(135deg, #1e9cfa 0%, #0ea5e9 100%);
            color: white;
            padding: 12px 24px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 8px;
            font-weight: 600;
            font-size: 16px;
        }

      .logo-icon {
        width: 40px;
        height: 40px;
        /* background: rgba(255, 255, 255, 0.2); */
        border-radius: 8px;
        display: flex;
        align-items: center;
        justify-content: center;
      }

        .search-container {
            flex: 1;
            max-width: 400px;
            margin: 0 24px;
            position: relative;
        }

        .search-input {
            width: 100%;
            padding: 10px 40px 10px 16px;
            border: none;
            border-radius: 8px;
            font-size: 14px;
            background: white;
            outline: none;
        }

        .search-icon {
            position: absolute;
            right: 12px;
            top: 50%;
            transform: translateY(-50%);
            color: #666;
        }

        .header-actions {
            display: flex;
            align-items: center;
            gap: 16px;
        }

        .quick-create {
            background: rgba(255, 255, 255, 0.15);
            border: 1px solid rgba(255, 255, 255, 0.3);
            color: white;
            padding: 8px 16px;
            border-radius: 6px;
            font-size: 14px;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 6px;
        }

      .user-avatar {
        width: 32px;
        height: 32px;
        background: white;
        border-radius: 50%;
        color: black;
        display: flex;
        align-items: center;
        justify-content: center;
        font-weight: 600;
        font-size: 14px;
        cursor: pointer;
      }

        /* Progress Steps */
        .progress-container {
            background: white;
            padding: 24px;
            border-bottom: 1px solid #e5e7eb;
            max-width: 1280px;
            margin: 10px auto;
            border-radius: 16px;
        }

        .progress-steps {
            display: flex;
            justify-content: center;
            align-items: center;
            max-width: 600px;
            margin: 0 auto;
        }

        .step {
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            flex: 1;
            position: relative;
        }

        .step:not(:last-child)::after {
            content: "";
            position: absolute;
            top: 24px;
            right: -50%;
            width: 100%;
            height: 2px;
            background: #e5e7eb;
            z-index: 1;
        }

        .step-icon {
            width: 48px;
            height: 48px;
            border-radius: 12px;
            background: #fff;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 12px;
            position: relative;
            z-index: 2;
            font-size: 20px;
            color: #9ca3af;
            border: 1px solid #e4e7ec;
        }

        .step-label {
            font-size: 14px;
            color: #6b7280;
            font-weight: 500;
        }

        .step.active .step-label {
            color: #344054;
        }

        /* Main Content */
        .main-content {
            max-width: 1280px;
            margin: 0 auto;
            padding: 32px 24px;
            background: white;
        }

        .invoice-header {
            text-align: center;
            margin-bottom: 40px;
        }

        .invoice-title {
            font-size: 32px;
            font-weight: 700;
            color: #111827;
            margin-bottom: 8px;
        }

        .invoice-container {
            border-radius: 12px;
            padding: 32px;
            max-width: 600px;
            margin: 0 auto;
        }

        .order-summary-section {
            margin-bottom: 32px;
        }

        .section-title {
            font-size: 16px;
            color: #6b7280;
            font-weight: 500;
            margin-bottom: 16px;
        }

        .product-name {
            font-size: 24px;
            font-weight: 700;
            color: #111827;
            margin-bottom: 8px;
        }

        .product-price {
            font-size: 20px;
            font-weight: 600;
            color: #111827;
            margin-bottom: 24px;
        }

        .extras-section {
            margin-bottom: 32px;
        }

        .extras-title {
            font-size: 18px;
            font-weight: 600;
            color: #111827;
            margin-bottom: 16px;
        }

        .extras-list {
            list-style: none;
            padding: 0;
        }

        .extras-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 8px 0;
            border-bottom: 1px solid #f3f4f6;
        }

        .extras-item:last-child {
            border-bottom: none;
        }

        .extras-item-name {
            font-size: 14px;
            color: #374151;
        }

        .extras-item-price {
            font-size: 14px;
            font-weight: 600;
            color: #111827;
        }

        .order-total-section {
            border-top: 2px solid #e5e7eb;
            padding-top: 16px;
            margin-bottom: 32px;
        }

        .order-total-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 16px;
        }

        .order-total-label {
            font-size: 18px;
            font-weight: 600;
            color: #111827;
        }

        .order-total-value {
            font-size: 24px;
            font-weight: 700;
            color: #111827;
        }

        .complete-btn-container {
            display: flex;
            justify-content: right;
            margin-bottom: 32px;
        }

        .complete-btn {
            background: #0086C9;
            color: white;
            border: none;
            padding: 12px 32px;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s ease;
        }

        .complete-btn:hover {
            background: #0284c7;
        }

        .complete-btn:disabled {
            background: #9ca3af;
            cursor: not-allowed;
        }

        .benefits-section {
            border-top: 1px solid #e5e7eb;
            padding-top: 24px;
        }

        .benefits-title {
            font-size: 18px;
            font-weight: 600;
            color: #111827;
            margin-bottom: 16px;
        }

        .benefits-list {
            list-style: none;
            padding: 0;
        }

        .benefits-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 8px 0;
        }

        .benefits-item-name {
            font-size: 14px;
            color: #374151;
        }

        .benefits-item-included {
            font-size: 14px;
            color: #6b7280;
        }

        /* Footer Navigation */
        .footer-nav {
            background: white;
            padding: 16px 24px;
            border-top: 1px solid #e5e7eb;
            display: flex;
            justify-content: space-between;
            align-items: center;
            max-width: 1280px;
            margin: 10px auto;
            border-radius: 16px;
        }

        .back-btn {
            background: none;
            border: none;
            color: #6b7280;
            font-size: 14px;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 8px 16px;
        }

        .save-btn {
            background: #f3f4f6;
            border: none;
            color: #6b7280;
            font-size: 14px;
            padding: 8px 24px;
            border-radius: 6px;
            cursor: pointer;
        }

        /* Loading and error states */
        .loading {
            display: flex;
            justify-content: center;
            align-items: center;
            color: #6b7280;
            font-style: italic;
        }

        .error {
            color: #dc2626;
            text-align: center;
            padding: 16px;
            background: #fee2e2;
            border-radius: 8px;
            margin: 16px 0;
        }

        /* Responsive Design */
        @media (max-width: 768px) {
            .header {
                padding: 12px 16px;
            }

            .search-container {
                margin: 0 16px;
                max-width: none;
            }

            .main-content {
                padding: 24px 16px;
            }

            .invoice-container {
                padding: 24px 20px;
            }

            .footer-nav {
                padding: 16px;
            }
        }

        @media (max-width: 480px) {
            .header-actions .quick-create span {
                display: none;
            }

            .invoice-container {
                padding: 20px 16px;
            }
        }
    </style>
</head>
<body>
    <!-- Header -->
    <div class="header">
      <div class="logo">
        <div class="logo-icon">
          <img src="/WebResource?id=mib-ezra-logo" alt="Logo" width="24" height="24" />
        </div>
        <span>Ezra</span>
      </div>
      <div class="search-container">
        <!-- <input type="text" class="search-input" placeholder="Search for a page">
            <div class="search-icon"></div> -->
      </div>
      <div class="header-actions">
        <!-- <button class="quick-create">
                <span>Quick Create</span>
            </button> -->
        <div class="user-avatar">MM</div>
      </div>
    </div>


    <!-- Progress Steps -->
    <div class="progress-container">
        <div class="progress-steps">
            <div class="step">
                <div class="step-icon">
                    <img src="/WebResource?id=package" width="24" height="24" alt="Package Icon" />
                </div>
                <div class="step-label">Choose Package</div>
            </div>
            <div class="step">
                <div class="step-icon">
                    <img src="/WebResource?id=shopping-bag-03" width="24" height="24" alt="Package Icon" />
                </div>
                <div class="step-label">Cart & Customization</div>
            </div>
            <div class="step active">
                <div class="step-icon">
                    <img src="/WebResource?id=file-check-02" width="24" height="24" alt="Package Icon" />
                </div>
                <div class="step-label">Invoice</div>
            </div>
        </div>
    </div>

    <!-- Main Content -->
    <div class="main-content">
        <div class="invoice-header">
            <h1 class="invoice-title">Invoice</h1>
        </div>

        <div class="invoice-container">
            <!-- Order Summary -->
            <div class="order-summary-section">
                <div class="section-title">Order Summary</div>
                <h2 class="product-name" id="invoice-product-name">Loading...</h2>
                <div class="product-price" id="invoice-product-price">Loading...</div>
            </div>

            <!-- Extras -->
            <div class="extras-section" id="extras-section">
                <h3 class="extras-title">Extras</h3>
                <ul class="extras-list" id="extras-list">
                    <li class="loading">Loading extras...</li>
                </ul>
            </div>

            <!-- Order Total -->
            <div class="order-total-section">
                <div class="order-total-row">
                    <span class="order-total-label">Order Total</span>
                    <span class="order-total-value" id="invoice-order-total">Loading...</span>
                </div>
            </div>

            <!-- Complete Order Button -->
            <div class="complete-btn-container">
                <button class="complete-btn" id="complete-order-btn">Complete Order</button>
            </div>

            <!-- Benefits -->
            <div class="benefits-section" id="benefits-section">
                <h4 class="benefits-title">Benefits</h4>
                <ul class="benefits-list" id="benefits-list">
                    <li class="loading">Loading benefits...</li>
                </ul>
            </div>
        </div>
    </div>

    <!-- Footer Navigation -->
    <div class="footer-nav">
        <button class="back-btn">
            ← Back
        </button>
        <button class="save-btn">Save</button>
    </div>

    <script>
        // API Configuration
        const API_BASE_URL = "https://fff.sandbox.api.ezra360.com/api/v1.0";
        const API_KEY = "TPiNa.aoAj0IkST3vQlyM9BRPiKphXmXSIxinKB8mPXSbnx5U";

        // Global variables
        let orderData = null;
        let selectedPackageData = null;

        // Format price for display
        function formatPrice(price) {
            if (price === 0 || price === 0.0) {
                return 'Contact for Price';
            }
            return `R${price.toLocaleString()}`;
        }

        // Get order data from localStorage
        function getOrderData() {
            try {
                const stored = localStorage.getItem('orderData');
                if (stored) {
                    return JSON.parse(stored);
                }
            } catch (error) {
                console.error('Error reading order data:', error);
            }
            return null;
        }

        // Get selected package data from localStorage
        function getSelectedPackageData() {
            try {
                const stored = localStorage.getItem('selectedPackage');
                if (stored) {
                    return JSON.parse(stored);
                }
            } catch (error) {
                console.error('Error reading selected package:', error);
            }
            return null;
        }

        // Parse benefits from package data (assuming it's stored in the selected package)
        function parseBenefits(benefitsString) {
            if (!benefitsString) return [];
            return benefitsString.split(',').map(benefit => benefit.trim()).filter(benefit => benefit.length > 0);
        }

        // Render invoice data
        function renderInvoice() {
            if (!orderData) {
                showError('No order data found');
                return;
            }

            // Update base package info
            const basePackage = orderData.basePackage;
            document.getElementById('invoice-product-name').textContent = basePackage.name;
            document.getElementById('invoice-product-price').textContent = formatPrice(basePackage.price);

            // Update extras
            renderExtras();

            // Update total
            document.getElementById('invoice-order-total').textContent = formatPrice(orderData.total);

            // Render benefits (if available from selected package)
            renderBenefits();
        }

        // Render extras section
        function renderExtras() {
            const extrasList = document.getElementById('extras-list');
            const extrasSection = document.getElementById('extras-section');

            if (!orderData.extras || Object.keys(orderData.extras).length === 0) {
                extrasSection.style.display = 'none';
                return;
            }

            let extrasHTML = '';
            Object.keys(orderData.extras).forEach(extraName => {
                const quantity = orderData.extras[extraName];
                if (quantity > 0) {
                    // For the invoice, we'll show quantity info in the name
                    const displayName = quantity > 1 ? `${extraName} (${quantity}x)` : extraName;
                    extrasHTML += `
                        <li class="extras-item">
                            <span class="extras-item-name">${displayName}</span>
                            <span class="extras-item-price">Included</span>
                        </li>
                    `;
                }
            });

            extrasList.innerHTML = extrasHTML;
        }

        // Render benefits section
        function renderBenefits() {
            const benefitsList = document.getElementById('benefits-list');
            
            // Try to get benefits from selected package data
            let benefits = [];
            if (selectedPackageData && selectedPackageData.benefits) {
                benefits = parseBenefits(selectedPackageData.benefits);
            }

            if (benefits.length === 0) {
                // Default benefits if none found
                benefits = ['Coffin', 'Hearse'];
            }

            let benefitsHTML = '';
            benefits.forEach(benefit => {
                benefitsHTML += `
                    <li class="benefits-item">
                        <span class="benefits-item-name">${benefit}</span>
                        <span class="benefits-item-included">--</span>
                    </li>
                `;
            });

            benefitsList.innerHTML = benefitsHTML;
        }

        // Submit order to API
        async function submitOrder() {
            try {
                const completeBtn = document.getElementById('complete-order-btn');
                completeBtn.disabled = true;
                completeBtn.textContent = 'Submitting...';

                // Prepare ProductGroupData
                const productGroupData = [{
                    productGroupId: selectedPackageData?.id || "c6ddec72-cdf1-41f6-bd84-34b7be945513",
                    productGroupName: orderData.basePackage.name,
                    price: orderData.basePackage.price
                }];

                // Prepare ProductData (extras)
                const productData = [];
                if (orderData.extras) {
                    Object.keys(orderData.extras).forEach(extraName => {
                        const quantity = orderData.extras[extraName];
                        if (quantity > 0) {
                            productData.push({
                                name: extraName,
                                costPrice: 0, // We don't have individual prices stored
                                Quantity: quantity
                            });
                        }
                    });
                }

                // Prepare BenefitData
                const benefitData = [];
                if (selectedPackageData && selectedPackageData.benefits) {
                    const benefits = parseBenefits(selectedPackageData.benefits);
                    benefits.forEach(benefit => {
                        benefitData.push({
                            BenefitName: benefit
                        });
                    });
                } else {
                    // Default benefits
                    benefitData.push(
                        { BenefitName: "Grave" },
                        { BenefitName: "Vehicle" },
                        { BenefitName: "COFFIN" }
                    );
                }

                const myHeaders = new Headers();
                myHeaders.append("api-key", API_KEY);
                myHeaders.append("Content-Type", "application/json");

                const raw = JSON.stringify({
                    "entityName": "Burial",
                    "requestName": "FecthingProductData",
                    "RecordId": "41822ddd-155b-4470-9aed-dddf5219c6d5",
                    "inputParamters": {
                        "ProductData": {
                            "ProductGroupData": productGroupData,
                            "ProductData": productData,
                            "BenefitData": benefitData
                        }
                    }
                });

                const requestOptions = {
                    method: "POST",
                    headers: myHeaders,
                    body: raw,
                    redirect: "follow"
                };

                const response = await fetch(`${API_BASE_URL}/entities/ExecuteRequest`, requestOptions);
                const result = await response.json();

                if (result.isSuccess) {
                    // Clear localStorage
                    localStorage.removeItem('orderData');
                    localStorage.removeItem('selectedPackage');
                    
                    // Route to success page
                    window.location.href = '/WebResource?id=success';
                } else {
                    throw new Error(result.clientMessage || 'Failed to submit order');
                }

            } catch (error) {
                console.error('Error submitting order:', error);
                showError('Failed to submit order. Please try again.');
                
                const completeBtn = document.getElementById('complete-order-btn');
                completeBtn.disabled = false;
                completeBtn.textContent = 'Complete Order';
            }
        }

        // Show error message
        function showError(message) {
            const errorDiv = document.createElement('div');
            errorDiv.className = 'error';
            errorDiv.textContent = message;
            
            const container = document.querySelector('.invoice-container');
            container.insertBefore(errorDiv, container.firstChild);
            
            // Remove error after 5 seconds
            setTimeout(() => {
                if (errorDiv.parentNode) {
                    errorDiv.parentNode.removeChild(errorDiv);
                }
            }, 5000);
        }

        // Initialize the invoice page
        function initializeInvoicePage() {
            // Load order data
            orderData = getOrderData();
            selectedPackageData = getSelectedPackageData();

            if (!orderData) {
                showError('No order data found. Please start from package selection.');
                return;
            }

            // Render the invoice
            renderInvoice();
        }

        // Button handlers
        document.getElementById('complete-order-btn').addEventListener('click', submitOrder);

        document.querySelector('.back-btn').addEventListener('click', () => {
            window.history.back();
        });

        document.querySelector('.save-btn').addEventListener('click', () => {
            alert('Invoice saved successfully!');
        });

        // Start the application
        document.addEventListener('DOMContentLoaded', initializeInvoicePage);
    </script>
</body>
</html>
