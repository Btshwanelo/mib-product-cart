<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Cart & Customization</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
          Oxygen, Ubuntu, Cantarell, sans-serif;
        background-color: #f5f5f5;
        color: #333;
      }

      .header {
        background: #fff;
        color: black;
        padding: 12px 24px;
        display: flex;
        align-items: center;
        justify-content: center;
        box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
      }

      .header h1 {
        font-size: 20px;
      }

      .logo {
        display: flex;
        align-items: center;
        gap: 8px;
        font-weight: 600;
        font-size: 16px;
      }

      .logo-icon {
        width: 40px;
        height: 40px;
        border-radius: 8px;
        display: flex;
        align-items: center;
        justify-content: center;
      }

      .search-container {
        flex: 1;
        max-width: 400px;
        margin: 0 24px;
        position: relative;
      }

      .search-input {
        width: 100%;
        padding: 10px 40px 10px 16px;
        border: none;
        border-radius: 8px;
        font-size: 14px;
        background: white;
        outline: none;
      }

      .search-icon {
        position: absolute;
        right: 12px;
        top: 50%;
        transform: translateY(-50%);
        color: #666;
      }

      .header-actions {
        display: flex;
        align-items: center;
        gap: 16px;
      }

      .quick-create {
        background: rgba(255, 255, 255, 0.15);
        border: 1px solid rgba(255, 255, 255, 0.3);
        color: white;
        padding: 8px 16px;
        border-radius: 6px;
        font-size: 14px;
        cursor: pointer;
        display: flex;
        align-items: center;
        gap: 6px;
      }

      .user-avatar {
        width: 32px;
        height: 32px;
        background: white;
        border-radius: 50%;
        color: black;
        display: flex;
        align-items: center;
        justify-content: center;
        font-weight: 600;
        font-size: 14px;
        cursor: pointer;
      }

      /* Progress Steps */
      .progress-container {
        background: white;
        padding: 24px;
        border-bottom: 1px solid #e5e7eb;
        max-width: 1280px;
        margin: 10px auto;
        border-radius: 16px;
      }

      .progress-steps {
        display: flex;
        justify-content: center;
        align-items: center;
        max-width: 600px;
        margin: 0 auto;
      }

      .step {
        display: flex;
        flex-direction: column;
        align-items: center;
        text-align: center;
        flex: 1;
        position: relative;
      }

      .step:not(:last-child)::after {
        content: "";
        position: absolute;
        top: 24px;
        right: -50%;
        width: 100%;
        height: 2px;
        background: #e5e7eb;
        z-index: 1;
      }

      .step-icon {
        width: 48px;
        height: 48px;
        border-radius: 12px;
        background: #fff;
        display: flex;
        align-items: center;
        justify-content: center;
        margin-bottom: 12px;
        position: relative;
        z-index: 2;
        font-size: 20px;
        color: #9ca3af;
        border: 1px solid #e4e7ec;
      }

      .step-label {
        font-size: 14px;
        color: #6b7280;
        font-weight: 500;
      }

      .step.active .step-label {
        color: #344054;
      }

      /* Main Content */
      .main-content {
        max-width: 1280px;
        margin: 0 auto;
        padding: 32px 24px;
        background: white;
      }

      .invoice-header {
        text-align: center;
        margin-bottom: 40px;
      }

      .invoice-title {
        font-size: 32px;
        font-weight: 700;
        color: #111827;
        margin-bottom: 8px;
      }

      .invoice-container {
        border-radius: 12px;
        padding: 32px;
        max-width: 600px;
        margin: 0 auto;
      }

      .order-summary-section {
        margin-bottom: 32px;
      }

      .section-title {
        font-size: 16px;
        color: #6b7280;
        font-weight: 500;
        margin-bottom: 16px;
      }

      .product-name {
        font-size: 24px;
        font-weight: 700;
        color: #111827;
        margin-bottom: 8px;
      }

      .product-price {
        font-size: 20px;
        font-weight: 600;
        color: #111827;
        margin-bottom: 24px;
      }

      .extras-section {
        margin-bottom: 32px;
      }

      .extras-title {
        font-size: 18px;
        font-weight: 600;
        color: #111827;
        margin-bottom: 16px;
      }

      .extras-list {
        list-style: none;
        padding: 0;
      }

      .extras-item {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 8px 0;
        border-bottom: 1px solid #f3f4f6;
      }

      .extras-item:last-child {
        border-bottom: none;
      }

      .extras-item-name {
        font-size: 14px;
        color: #374151;
      }

      .extras-item-price {
        font-size: 14px;
        font-weight: 600;
        color: #111827;
      }

      .order-total-section {
        border-top: 2px solid #e5e7eb;
        padding-top: 16px;
        margin-bottom: 32px;
      }

      .order-total-row {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 16px;
      }

      .order-total-label {
        font-size: 18px;
        font-weight: 600;
        color: #111827;
      }

      .order-total-value {
        font-size: 24px;
        font-weight: 700;
        color: #111827;
      }

      .complete-btn-container {
        display: flex;
        justify-content: right;
        margin-bottom: 32px;
      }

      .complete-btn {
        background: #0086c9;
        color: white;
        border: none;
        padding: 12px 32px;
        border-radius: 8px;
        font-size: 16px;
        font-weight: 600;
        cursor: pointer;
        transition: background 0.2s ease;
      }

      .complete-btn:hover {
        background: #0284c7;
      }

      .complete-btn:disabled {
        background: #9ca3af;
        cursor: not-allowed;
      }

      .benefits-section {
        border-top: 1px solid #e5e7eb;
        padding-top: 24px;
      }

      .benefits-title {
        font-size: 18px;
        font-weight: 600;
        color: #111827;
        margin-bottom: 16px;
      }

      .benefits-list {
        list-style: none;
        padding: 0;
      }

      .benefits-item {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 8px 0;
      }

      .benefits-item-name {
        font-size: 14px;
        color: #374151;
      }

      .benefits-item-included {
        font-size: 14px;
        color: #6b7280;
      }

      /* Footer Navigation */
      .footer-nav {
        background: white;
        padding: 16px 24px;
        border-top: 1px solid #e5e7eb;
        display: flex;
        justify-content: space-between;
        align-items: center;
        max-width: 1280px;
        margin: 10px auto;
        border-radius: 16px;
      }

      .back-btn {
        background: #0086c9;
        border: none;
        color: white;
        font-size: 14px;
        padding: 8px 24px;
        border-radius: 6px;
        cursor: pointer;
      }

      .save-btn {
        background: #0086c9;
        border: none;
        color: white;
        font-size: 14px;
        padding: 8px 24px;
        border-radius: 6px;
        cursor: pointer;
      }

      /* Loading and error states */
      .loading {
        display: flex;
        justify-content: center;
        align-items: center;
        color: #6b7280;
        font-style: italic;
      }

      .error {
        color: #dc2626;
        text-align: center;
        padding: 16px;
        background: #fee2e2;
        border-radius: 8px;
        margin: 16px 0;
      }

      /* Responsive Design */
      @media (max-width: 768px) {
        .header {
          padding: 12px 16px;
        }

        .search-container {
          margin: 0 16px;
          max-width: none;
        }

        .main-content {
          padding: 24px 16px;
        }

        .invoice-container {
          padding: 24px 20px;
        }

        .footer-nav {
          padding: 16px;
        }
      }

      @media (max-width: 480px) {
        .header-actions .quick-create span {
          display: none;
        }

        .invoice-container {
          padding: 20px 16px;
        }
      }

      /* Modal Styles */
      .modal {
        display: none;
        position: fixed;
        z-index: 1000;
        left: 0;
        top: 0;
        width: 100%;
        height: 100%;
        background-color: rgba(0, 0, 0, 0.5);
      }

      .modal-content {
        background-color: white;
        margin: 15% auto;
        padding: 0;
        border-radius: 12px;
        width: 400px;
        max-width: 90%;
        box-shadow: 0 10px 25px rgba(0, 0, 0, 0.2);
      }

      .modal-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 24px 24px 0 24px;
      }

      .modal-icon {
        width: 48px;
        height: 48px;
        background: #fef3c7;
        border-radius: 50%;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 24px;
      }

      .modal-icon svg {
        color: #dc6803;
      }

      .modal-close {
        background: none;
        border: none;
        font-size: 24px;
        cursor: pointer;
        color: #9ca3af;
        padding: 0;
        width: 24px;
        height: 24px;
      }

      .modal-body {
        padding: 16px 24px 24px;
      }

      .modal-body h3 {
        font-size: 18px;
        font-weight: 600;
        color: #111827;
        margin-bottom: 8px;
      }

      .modal-body p {
        font-size: 14px;
        color: #6b7280;
        line-height: 1.5;
      }

      .modal-buttons {
        display: flex;
        gap: 12px;
        padding: 0 24px 24px;
      }

      .modal-btn-primary {
        background: #0086c9;
        color: white;
        border: none;
        padding: 12px 24px;
        border-radius: 8px;
        font-size: 14px;
        font-weight: 600;
        cursor: pointer;
        flex: 1;
      }

      .modal-btn-primary:hover {
        background: #0284c7;
      }

      .modal-btn-secondary {
        background: white;
        color: #374151;
        border: 1px solid #d1d5db;
        padding: 12px 24px;
        border-radius: 8px;
        font-size: 14px;
        font-weight: 600;
        cursor: pointer;
        flex: 1;
      }

      .modal-btn-secondary:hover {
        background: #f9fafb;
      }
    </style>
  </head>
  <body>
    <!-- Header -->
    <div class="header">
      <div class="">
        <h1 id="burial-header">Burial Planning</h1>
      </div>
    </div>

    <!-- Progress Steps -->
    <div class="progress-container">
      <div class="progress-steps">
        <div class="step">
          <div class="step-icon">
            <img
              src="/WebResource?id=package"
              width="24"
              height="24"
              alt="Package Icon"
            />
          </div>
          <div class="step-label">Choose Package</div>
        </div>
        <div class="step">
          <div class="step-icon">
            <img
              src="/WebResource?id=shopping-bag-03"
              width="24"
              height="24"
              alt="Package Icon"
            />
          </div>
          <div class="step-label">Cart & Customization</div>
        </div>
        <div class="step active">
          <div class="step-icon">
            <img
              src="/WebResource?id=file-check-02"
              width="24"
              height="24"
              alt="Package Icon"
            />
          </div>
          <div class="step-label">Invoice</div>
        </div>
      </div>
    </div>

    <!-- Main Content -->
    <div class="main-content">
      <div class="invoice-header">
        <h1 class="invoice-title">Invoice</h1>
      </div>

      <div class="invoice-container">
        <!-- Order Summary -->
        <div class="order-summary-section">
          <div class="section-title">Order Summary</div>
          <h2 class="product-name" id="invoice-product-name">Loading...</h2>
          <div class="product-price" id="invoice-product-price">Loading...</div>
        </div>

        <!-- Extras -->
        <div class="extras-section" id="extras-section">
          <h3 class="extras-title">Extras</h3>
          <ul class="extras-list" id="extras-list">
            <li class="loading">Loading extras...</li>
          </ul>
        </div>

        <!-- Order Total -->
        <div class="order-total-section">
          <div class="order-total-row">
            <span class="order-total-label">Order Total</span>
            <span class="order-total-value" id="invoice-order-total"
              >Loading...</span
            >
          </div>
        </div>

        <!-- Complete Order Button -->
        <div class="complete-btn-container">
          <button class="complete-btn" id="complete-order-btn">
            Complete Order
          </button>
        </div>

        <!-- Benefits -->
        <div class="benefits-section" id="benefits-section">
          <h4 class="benefits-title">Benefits</h4>
          <ul class="benefits-list" id="benefits-list">
            <li class="loading">Loading benefits...</li>
          </ul>
        </div>
      </div>
    </div>

    <!-- Footer Navigation -->
    <div class="footer-nav">
      <button class="back-btn">← Back</button>
      <button class="save-btn">Save</button>
    </div>

    <script>
      // API Configuration
      const API_BASE_URL = "https://mib.sandbox.api.ezra360.com/api/v1.0";
      const API_KEY = "1bcTCI.pWzRtox0PIXllAvT0hrPd0Sz32FvlhBIxBKgouivzfx";

      // Global variables
      let orderData = null;
      let selectedPackageData = null;
      let allProductsData = [];
      let urlParams = {}; // Add this line

      // Function to extract URL parameters
      function getUrlParameters() {
        const params = {};
        let currentUrl = window.location.href;

        // Try to get the parent URL if we're in an iframe/nested context
        try {
          if (
            window.parent &&
            window.parent !== window &&
            window.parent.location
          ) {
            currentUrl = window.parent.location.href;
          }
        } catch (e) {
          // Cross-origin restriction - try alternative methods
          console.log(
            "Cannot access parent URL due to cross-origin restrictions"
          );
        }

        // Alternative: Check if referrer contains our parameters
        if (document.referrer && document.referrer.includes("title=")) {
          currentUrl = document.referrer;
        }

        // Debug logging
        console.log("Current page URL:", window.location.href);
        console.log("Parent/Referrer URL:", currentUrl);
        console.log("Document referrer:", document.referrer);

        try {
          // Method 1: Parse current page parameters
          const urlSearchParams = new URLSearchParams(window.location.search);
          for (const [key, value] of urlSearchParams) {
            params[key] = decodeURIComponent(value);
          }

          // Method 2: Parse from the full URL (parent or referrer)
          const titleMatch = currentUrl.match(/[?&]title=([^&]+)/);
          const burialIdMatch = currentUrl.match(/[?&]burialId=([^&]+)/);

          if (titleMatch) {
            try {
              params.title = decodeURIComponent(titleMatch[1]);
            } catch (e) {
              params.title = titleMatch[1];
            }
          }

          if (burialIdMatch) {
            try {
              params.burialId = decodeURIComponent(burialIdMatch[1]);
            } catch (e) {
              params.burialId = burialIdMatch[1];
            }
          }

          // Method 3: Try to parse from hash if parameters are there
          if (window.location.hash) {
            const hashParams = window.location.hash.substring(1);
            const hashUrlParams = new URLSearchParams(hashParams);
            for (const [key, value] of hashUrlParams) {
              params[key] = decodeURIComponent(value);
            }
          }
        } catch (error) {
          console.error("Error parsing URL parameters:", error);
        }

        return params;
      }

      // Function to extract burial ID and name from title parameter
      function parseTitle(title) {
        if (!title) return { burialId: "", name: "" };

        // Expected format: "B001665 - Thabiso Zungu"
        const parts = title.split(" - ");
        if (parts.length >= 2) {
          return {
            burialId: parts[0].trim(),
            name: parts.slice(1).join(" - ").trim(),
          };
        }

        // Fallback: if format is different, try to extract what we can
        return {
          burialId: parts[0] || "",
          name: title,
        };
      }

      // Function to update the header with extracted information
      function updateHeader() {
        urlParams = getUrlParameters();
        const headerElement = document.getElementById("burial-header");

        if (urlParams.title) {
          const { burialId, name } = parseTitle(urlParams.title);

          if (name && burialId) {
            headerElement.textContent = `Burial Planning of: ${name} (${burialId})`;
          } else if (urlParams.title) {
            headerElement.textContent = `Burial Planning of: ${urlParams.title}`;
          }
        } else if (urlParams.burialId) {
          // Fallback: if burialId is passed as separate parameter
          const name = urlParams.name || "Unknown";
          headerElement.textContent = `Burial Planning of: ${name} (${urlParams.burialId})`;
        }

        // Log extracted parameters for debugging
        console.log("Extracted URL Parameters:", urlParams);
        console.log(
          "Parsed title:",
          urlParams.title ? parseTitle(urlParams.title) : "No title parameter"
        );
      }

      // Format price for display
      function formatPrice(price) {
        if (price === 0 || price === 0.0) {
          return "Contact for Price";
        }
        return `R${price.toLocaleString()}`;
      }

      // Get order data from session storage
      function getOrderData() {
        try {
          const stored = sessionStorage.getItem("orderData");
          if (stored) {
            const parsed = JSON.parse(stored);
            if (Date.now() - parsed.timestamp < 3600000) {
              return parsed;
            }
          }
        } catch (error) {
          console.error("Error reading order data:", error);
        }
        return null;
      }

      // Get selected package data from session storage
      function getSelectedPackageData() {
        try {
          const stored = sessionStorage.getItem("selectedPackage");
          if (stored) {
            const parsed = JSON.parse(stored);
            if (Date.now() - parsed.timestamp < 3600000) {
              return parsed;
            }
          }
        } catch (error) {
          console.error("Error reading selected package:", error);
        }
        return null;
      }

      // Fetch all products to get extras details
      async function fetchAllProducts() {
        try {
          const myHeaders = new Headers();
          myHeaders.append("api-key", API_KEY);
          myHeaders.append("Content-Type", "application/json");

          const raw = JSON.stringify({
            entityName: "ProductGroup",
            requestName: "ProductGroupListingExecuteRequest",
          });

          const requestOptions = {
            method: "POST",
            headers: myHeaders,
            body: raw,
            redirect: "follow",
          };

          const response = await fetch(
            `${API_BASE_URL}/entities/ExecuteRequest`,
            requestOptions
          );
          const result = await response.json();

          if (
            result.isSuccess &&
            result.outputParameters &&
            result.outputParameters.ProductGroupData
          ) {
            return result.outputParameters.ProductGroupData;
          } else {
            throw new Error("Failed to fetch products");
          }
        } catch (error) {
          console.error("Error fetching products:", error);
          return [];
        }
      }

      // Parse benefits from package data
      function parseBenefits(benefitsString) {
        if (!benefitsString) return [];
        return benefitsString
          .split(",")
          .map((benefit) => benefit.trim())
          .filter((benefit) => benefit.length > 0);
      }

      // Find product details by ID
      function findProductById(productId) {
        return allProductsData.find(
          (product) => product.productGroupId === productId
        );
      }

      // Render invoice data
      function renderInvoice() {
        if (!orderData) {
          showError("No order data found");
          return;
        }

        // Update base package info
        const basePackage = orderData.basePackage;
        document.getElementById("invoice-product-name").textContent =
          basePackage.name || "Selected Package";
        document.getElementById("invoice-product-price").textContent =
          formatPrice(basePackage.price || 0);

        // Update extras
        renderExtras();

        // Update total
        document.getElementById("invoice-order-total").textContent =
          formatPrice(orderData.total || 0);

        // Render benefits (if available from selected package)
        renderBenefits();
      }

      // Updated renderExtras function to handle new extras data structure
      function renderExtras() {
        const extrasList = document.getElementById("extras-list");
        const extrasSection = document.getElementById("extras-section");

        if (!orderData.extras || Object.keys(orderData.extras).length === 0) {
          extrasSection.style.display = "none";
          return;
        }

        let extrasHTML = "";
        let hasExtras = false;

        Object.keys(orderData.extras).forEach((extraName) => {
          const extra = orderData.extras[extraName];

          // Handle both old format (just quantity) and new format (complete object)
          let quantity, costPrice, name;

          if (typeof extra === "number") {
            // Old format: just quantity
            quantity = extra;
            costPrice = 0; // Will try to find from API data
            name = extraName;
          } else if (extra && extra.Quantity !== undefined) {
            // New format: complete object
            quantity = extra.Quantity;
            costPrice = extra.costPrice || 0;
            name = extra.name || extraName;
          } else {
            return; // Skip invalid entries
          }

          if (quantity > 0) {
            hasExtras = true;

            const displayName = quantity > 1 ? `${name} (${quantity}x)` : name;

            // Calculate price - use stored costPrice if available, otherwise try to find from API data
            let priceDisplay = "Contact for Price";
            if (costPrice > 0) {
              const totalPrice = costPrice * quantity;
              priceDisplay = formatPrice(totalPrice);
            } else {
              // Fallback: try to find product details from API data by name
              const productDetails = allProductsData.find(
                (product) =>
                  product.productGroupName === name ||
                  product.productGroupName === extraName
              );
              if (productDetails && productDetails.price > 0) {
                const totalPrice = productDetails.price * quantity;
                priceDisplay = formatPrice(totalPrice);
              }
            }

            extrasHTML += `
                <li class="extras-item">
                    <span class="extras-item-name">${displayName}</span>
                    <span class="extras-item-price">${priceDisplay}</span>
                </li>
            `;
          }
        });

        if (!hasExtras) {
          extrasSection.style.display = "none";
        } else {
          extrasList.innerHTML = extrasHTML;
        }
      }
      // Render benefits section
      function renderBenefits() {
        const benefitsList = document.getElementById("benefits-list");

        // Try to get benefits from selected package data
        let benefits = [];
        if (selectedPackageData) {
          // Check if benefits are stored in the package data
          if (selectedPackageData.benefits) {
            benefits = parseBenefits(selectedPackageData.benefits);
          } else {
            // Try to find the package in API data to get benefits
            const packageDetails = findProductById(selectedPackageData.id);
            if (packageDetails && packageDetails.benefits) {
              benefits = parseBenefits(packageDetails.benefits);
            }
          }
        }

        if (benefits.length === 0) {
          // If no benefits found, hide the section or show a default message
          benefitsList.innerHTML =
            '<li class="loading">No benefits information available</li>';
          return;
        }

        let benefitsHTML = "";
        benefits.forEach((benefit) => {
          benefitsHTML += `
                    <li class="benefits-item">
                        <span class="benefits-item-name">${benefit}</span>
                        <span class="benefits-item-included">Included</span>
                    </li>
                `;
        });

        benefitsList.innerHTML = benefitsHTML;
      }

      // Submit order to API
      async function submitOrder() {
        try {
          const completeBtn = document.getElementById("complete-order-btn");
          completeBtn.disabled = true;
          completeBtn.textContent = "Submitting...";

          // Extract burial ID from URL parameters
          const burialId = urlParams.burialId;

          // Check if we have a base product or only extras
          const basePackagePrice =
            selectedPackageData?.price || orderData.basePackage.price || 0;
          const hasBaseProduct =
            basePackagePrice > 0 && selectedPackageData?.productGroupId;

          // Prepare ProductData (extras) using orderData.extras
          const productData = [];
          if (orderData.extras) {
            Object.keys(orderData.extras).forEach((extraName) => {
              const extra = orderData.extras[extraName];

              // Handle both old format (just quantity) and new format (complete object)
              let quantity, costPrice, name;

              if (typeof extra === "number") {
                // Old format: just quantity
                quantity = extra;
                name = extraName;
                // Try to find product details from API data by name
                const productDetails = allProductsData.find(
                  (product) => product.productGroupName === extraName
                );
                costPrice = productDetails ? productDetails.price : 0;
              } else if (extra && extra.Quantity !== undefined) {
                // New format: complete object
                quantity = extra.Quantity;
                costPrice = extra.costPrice || 0;
                name = extra.name || extraName;
              } else {
                return; // Skip invalid entries
              }

              if (quantity > 0) {
                productData.push({
                  name: name,
                  costPrice: costPrice,
                  Quantity: quantity,
                });
              }
            });
          }

          const myHeaders = new Headers();
          myHeaders.append("api-key", API_KEY);
          myHeaders.append("Content-Type", "application/json");

          let payload;
          let requestOptions;

          if (hasBaseProduct) {
            // Original API call for when we have a base product
            // Prepare ProductGroupData using selectedPackageData
            const productGroupData = [];
            if (selectedPackageData?.productGroupId) {
              productGroupData.push({
                productGroupId: selectedPackageData.productGroupId,
                productGroupName:
                  selectedPackageData.productGroupName ||
                  orderData.basePackage.name,
                price: basePackagePrice,
              });
            }

            // Prepare BenefitData using selectedPackageData.benefits
            const benefitData = [];
            if (selectedPackageData && selectedPackageData.benefits) {
              const benefits = parseBenefits(selectedPackageData.benefits);
              benefits.forEach((benefit) => {
                // Extract just the benefit name (remove quantities like ": 1")
                const cleanBenefitName = benefit.split(":")[0].trim();
                if (cleanBenefitName) {
                  benefitData.push({
                    BenefitName: cleanBenefitName,
                  });
                }
              });
            }

            payload = {
              entityName: "Burial",
              requestName: "FecthingProductData",
              inputParamters: {
                ProductData: {
                  BurialId: burialId,
                  ProductGroupData: productGroupData,
                  ProductData: productData,
                  BenefitData: benefitData,
                },
              },
            };
          } else {
            // New API call for when we only have extras (no base product)
            payload = {
              entityName: "Burial",
              requestName: "AddExtrasToBurial",
              inputParamters: {
                ProductData: {
                  BurialId: burialId,
                  ExtraData: productData,
                },
              },
            };
          }

          // Log the payload for debugging
          console.log("Submitting payload:", JSON.stringify(payload, null, 2));

          requestOptions = {
            method: "POST",
            headers: myHeaders,
            body: JSON.stringify(payload),
            redirect: "follow",
          };

          const response = await fetch(
            `${API_BASE_URL}/entities/ExecuteRequest`,
            requestOptions
          );
          const result = await response.json();

          console.log("API Response:", result);

          if (result.isSuccess) {
            // Clear session storage
            sessionStorage.removeItem("orderData");
            sessionStorage.removeItem("selectedPackage");

            // Route to success page or back to start
            window.location.href = "/WebResource?id=cart-success";
          } else {
            throw new Error(result.clientMessage || "Failed to submit order");
          }
        } catch (error) {
          console.error("Error submitting order:", error);
          showError("Failed to submit order. Please try again.");

          const completeBtn = document.getElementById("complete-order-btn");
          completeBtn.disabled = false;
          completeBtn.textContent = "Complete Order";
        }
      }
      // Show error message
      function showError(message) {
        const errorDiv = document.createElement("div");
        errorDiv.className = "error";
        errorDiv.textContent = message;

        const container = document.querySelector(".invoice-container");
        container.insertBefore(errorDiv, container.firstChild);

        // Remove error after 5 seconds
        setTimeout(() => {
          if (errorDiv.parentNode) {
            errorDiv.parentNode.removeChild(errorDiv);
          }
        }, 5000);
      }

      // Check if back button should navigate to extras page
      function shouldNavigateToExtras() {
        try {
          const ezraAppData = sessionStorage.getItem("ezra_app_data");
          if (ezraAppData) {
            const parsed = JSON.parse(ezraAppData);
            if (
              parsed.burialData &&
              parsed.burialData.outputParameters &&
              parsed.burialData.outputParameters.PageIndicator ===
                "CustomizationPage"
            ) {
              console.log(
                "PageIndicator is CustomizationPage - back button will navigate to extras page"
              );
              return true;
            }
          }
        } catch (error) {
          console.error("Error checking ezra_app_data:", error);
        }
        return false;
      }

      // Initialize the invoice page
      async function initializeInvoicePage() {
        updateHeader();

        try {
          // Load order data
          orderData = getOrderData();
          selectedPackageData = getSelectedPackageData();

          if (!orderData) {
            showError(
              "No order data found. Please start from package selection."
            );
            return;
          }

          // Debug logging for extras data structure
          console.log("Order data loaded:", orderData);
          console.log("Extras data structure:", orderData.extras);
          if (orderData.extras) {
            Object.keys(orderData.extras).forEach((extraName) => {
              const extra = orderData.extras[extraName];
              console.log(
                `Extra "${extraName}":`,
                extra,
                "Type:",
                typeof extra
              );
            });
          }

          // Fetch all products data to get details for extras
          allProductsData = await fetchAllProducts();

          // Render the invoice
          renderInvoice();
        } catch (error) {
          console.error("Error initializing invoice page:", error);
          showError("Failed to load invoice details. Please try again.");
        }
      }

      // Button handlers
      document
        .getElementById("complete-order-btn")
        .addEventListener("click", submitOrder);

      document.querySelector(".back-btn").addEventListener("click", () => {
        // Check if we should navigate to extras page based on PageIndicator
        if (shouldNavigateToExtras()) {
          window.location.href = "/WebResource?id=cart-extras"; // Navigate back to extras page
        } else {
          window.location.href = "/WebResource?id=cart-cart"; // Navigate back to cart page
        }
      });

      // Replace the existing save button handler with this:
      document.querySelector(".save-btn").addEventListener("click", () => {
        // Show the save modal
        document.getElementById("save-modal").style.display = "block";
      });

      // Add these new functions:
      function closeSaveModal() {
        document.getElementById("save-modal").style.display = "none";
      }

      function confirmSave() {
        // Save current selections - use existing orderData if available
        const currentOrderData = orderData || {
          basePackage: {
            name: selectedPackageData?.productGroupName || "Selected Package",
            price: selectedPackageData?.price || 0,
          },
          extras: {},
          total: 0,
          timestamp: Date.now(),
        };

        sessionStorage.setItem("orderData", JSON.stringify(currentOrderData));

        // Redirect to /cart
        window.parent.location.href =
          "https://mib.sandbox.ezra360.com/Entity/List/Burial?mod=BurialServices";
      }

      // Close modal when clicking outside of it
      window.onclick = function (event) {
        const modal = document.getElementById("save-modal");
        if (event.target == modal) {
          closeSaveModal();
        }
      };
      // Start the application
      document.addEventListener("DOMContentLoaded", initializeInvoicePage);
    </script>
    <!-- Save Modal -->
    <div id="save-modal" class="modal" style="display: none">
      <div class="modal-content">
        <div class="modal-header">
          <div class="modal-icon">
            <svg
              xmlns="http://www.w3.org/2000/svg"
              width="24"
              height="24"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
              class="lucide lucide-circle-alert-icon lucide-circle-alert"
            >
              <circle cx="12" cy="12" r="10" />
              <line x1="12" x2="12" y1="8" y2="12" />
              <line x1="12" x2="12.01" y1="16" y2="16" />
            </svg>
          </div>
          <button class="modal-close" onclick="closeSaveModal()">
            &times;
          </button>
        </div>
        <div class="modal-body">
          <h3>Saving Order</h3>
          <p>Are you sure you want to save this order to continue later?</p>
        </div>
        <div class="modal-buttons">
          <button class="modal-btn-primary" onclick="confirmSave()">
            Yes, Save
          </button>
          <button class="modal-btn-secondary" onclick="closeSaveModal()">
            No, Continue
          </button>
        </div>
      </div>
    </div>
  </body>
</html>
