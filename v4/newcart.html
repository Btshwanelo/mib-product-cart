    <script>
        // API Configuration
        const API_BASE_URL = "https://mib.sandbox.api.ezra360.com/api/v1.0";

        // Global variables
let allProducts = [];
let currentProduct = null;
let urlParams = {}; // Add this line

// Function to extract URL parameters
function getUrlParameters() {
    const params = {};
    let currentUrl = window.location.href;
    
    // Try to get the parent URL if we're in an iframe/nested context
    try {
        if (window.parent && window.parent !== window && window.parent.location) {
            currentUrl = window.parent.location.href;
        }
    } catch (e) {
        // Cross-origin restriction - try alternative methods
        console.log('Cannot access parent URL due to cross-origin restrictions');
    }
    
    // Alternative: Check if referrer contains our parameters
    if (document.referrer && document.referrer.includes('title=')) {
        currentUrl = document.referrer;
    }
    
    // Debug logging
    console.log('Current page URL:', window.location.href);
    console.log('Parent/Referrer URL:', currentUrl);
    console.log('Document referrer:', document.referrer);
    
    try {
        // Method 1: Parse current page parameters
        const urlSearchParams = new URLSearchParams(window.location.search);
        for (const [key, value] of urlSearchParams) {
            params[key] = properDecodeURIComponent(value);
        }
        
        // Method 2: Parse from the full URL (parent or referrer)
        const titleMatch = currentUrl.match(/[?&]title=([^&]+)/);
        const burialIdMatch = currentUrl.match(/[?&]burialId=([^&]+)/);
        
        if (titleMatch) {
            params.title = properDecodeURIComponent(titleMatch[1]);
        }
        
        if (burialIdMatch) {
            params.burialId = properDecodeURIComponent(burialIdMatch[1]);
        }
        
        // Method 3: Try to parse from hash if parameters are there
        if (window.location.hash) {
            const hashParams = window.location.hash.substring(1);
            const hashUrlParams = new URLSearchParams(hashParams);
            for (const [key, value] of hashUrlParams) {
                params[key] = properDecodeURIComponent(value);
            }
        }
        
    } catch (error) {
        console.error('Error parsing URL parameters:', error);
    }
    
    return params;
}

// Function to extract burial ID and name from title parameter
function parseTitle(title) {
    if (!title) return { burialId: '', name: '' };
    
    // Clean the title first - remove any duplicate encoding issues
    let cleanTitle = title;
    
    // Handle cases where the title might be duplicated
    // "B001672+-+Jetta+Khomane (B001672+-+Jetta+Khomane)" -> "B001672 - Jetta Khomane"
    if (cleanTitle.includes('(') && cleanTitle.includes(')')) {
        // Extract the content before the parentheses
        const beforeParen = cleanTitle.split('(')[0].trim();
        if (beforeParen) {
            cleanTitle = beforeParen;
        }
    }
    
    // Replace any remaining + with spaces and clean up
    cleanTitle = cleanTitle.replace(/\+/g, ' ').replace(/\s+/g, ' ').trim();
    
    // Expected format: "B001672 - Jetta Khomane"
    const parts = cleanTitle.split(' - ');
    if (parts.length >= 2) {
        return {
            burialId: parts[0].trim(),
            name: parts.slice(1).join(' - ').trim()
        };
    }
    
    // Fallback: try to find burial ID pattern and extract name
    const burialIdMatch = cleanTitle.match(/^([B]\d+)/);
    if (burialIdMatch) {
        const burialId = burialIdMatch[1];
        const name = cleanTitle.replace(burialId, '').replace(/^[\s\-]+/, '').trim();
        return {
            burialId: burialId,
            name: name || 'Unknown'
        };
    }
    
    // Final fallback
    return {
        burialId: parts[0] || '',
        name: cleanTitle
    };
}

// Function to properly decode URL parameters
function properDecodeURIComponent(str) {
    try {
        // First replace + with spaces (URL encoding convention)
        const spacesFixed = str.replace(/\+/g, ' ');
        // Then decode URI component
        return decodeURIComponent(spacesFixed);
    } catch (e) {
        // Fallback: just replace + with spaces if decoding fails
        return str.replace(/\+/g, ' ');
    }
}

// Function to update the header with extracted information
function updateHeader() {
    urlParams = getUrlParameters();
    console.log("urlParams---", urlParams);
    const headerElement = document.getElementById('burial-header');
    
    if (urlParams.title) {
        const { burialId, name } = parseTitle(urlParams.title);
        
        if (name && burialId && name !== 'Unknown') {
            headerElement.textContent = `Burial Planning of: ${name} (${burialId})`;
        } else if (urlParams.title) {
            // Clean up the title for display
            const cleanTitle = urlParams.title.replace(/\+/g, ' ').replace(/\s+/g, ' ').trim();
            headerElement.textContent = `Burial Planning of: ${cleanTitle}`;
        }
    } else if (urlParams.burialId) {
        // Fallback: if burialId is passed as separate parameter
        const name = urlParams.name || 'Unknown';
        headerElement.textContent = `Burial Planning of: ${name} (${urlParams.burialId})`;
    }
    
    // Log extracted parameters for debugging
    console.log('Extracted URL Parameters:', urlParams);
    console.log('Parsed title:', urlParams.title ? parseTitle(urlParams.title) : 'No title parameter');
}

        // Fetch packages from API
        async function fetchPackages() {
            try {
                const myHeaders = new Headers();
                myHeaders.append("api-key", API_KEY);
                myHeaders.append("Content-Type", "application/json");

                const raw = JSON.stringify({
                    "entityName": "ProductGroup",
                    "requestName": "ProductGroupListingExecuteRequest"
                });

                const requestOptions = {
                    method: "POST",
                    headers: myHeaders,
                    body: raw,
                    redirect: "follow"
                };

                const response = await fetch(`${API_BASE_URL}/entities/ExecuteRequest`, requestOptions);
                const result = await response.json();

                if (result.isSuccess && result.outputParameters && result.outputParameters.ProductGroupData) {
                    return result.outputParameters.ProductGroupData;
                } else {
                    throw new Error('Failed to fetch packages');
                }
            } catch (error) {
                console.error('Error fetching packages:', error);
                throw error;
            }
        }

        // Format price for display
        function formatPrice(price) {
            if (price === 0 || price === 0.0) {
                return 'Contact for Price';
            }
            return `R${price.toLocaleString()}`;
        }

        // Parse benefits string into array
        function parseBenefits(benefitsString) {
            if (!benefitsString) return [];
            return benefitsString.split(',').map(benefit => benefit.trim()).filter(benefit => benefit.length > 0);
        }

        // Get selected package from memory (session) storage or return null
        function getSelectedPackage() {
    try {
        const stored = sessionStorage.getItem('selectedPackage');
        if (stored) {
            const parsed = JSON.parse(stored);
            // Check if the selection is recent (within 1 hour)
            if (Date.now() - parsed.timestamp < 3600000) {
                // Handle old format (convert to new format if needed)
                if (parsed.id && !parsed.productGroupId) {
                    parsed.productGroupId = parsed.id;
                }
                if (parsed.name && !parsed.productGroupName) {
                    parsed.productGroupName = parsed.name;
                }
                return parsed;
            }
        }
    } catch (error) {
        console.error('Error reading selected package:', error);
    }
    return null;
}

// Add this helper function
function getProductIdFromPackage(packageData) {

function getSavedOrderData() {
    try {
        const saved = sessionStorage.getItem('orderData');
        if (saved) {
            const orderData = JSON.parse(saved);
            // Check if data is recent (within 1 hour)
            if (Date.now() - orderData.timestamp < 3600000) {
                return orderData;
            }
        }
    } catch (error) {
        console.error('Error reading saved order data:', error);
    }
    return null;
}

    try {
        sessionStorage.removeItem('orderData');
    } catch (error) {
        console.error('Error clearing order data:', error);

}

                <div class="extras-section" style="margin: 16px 0; padding: 16px 0; border-top: 1px solid #e5e7eb;">
                    <h4 style="font-size: 14px; font-weight: 600; color: #111827; margin-bottom: 12px;">Added Extras:</h4>
                    ${Object.keys(extras).map(extraName => {
                        const quantity = extras[extraName];
                        return `
                            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 4px; font-size: 14px; color: #6b7280;">
                                <span>${extraName} (${quantity}x)</span>
                            </div>
                        `;
                    }).join('')}
                </div>
            `;
        }
    }

    // Calculate final total
    const finalTotal = product.price + extrasTotal;

    // Update main product display
    const productDisplayContainer = document.getElementById('product-display-container');
    productDisplayContainer.innerHTML = `
        <div>
            <div class="product-image">
                ${hasImage ? 
                    `<img src="${product.url}" alt="${product.productGroupName}" onerror="this.parentElement.innerHTML='<div class=&quot;product-image-placeholder&quot;>No Image Available</div>'" />` :
                    `<div class="product-image-placeholder">No Image Available</div>`
                }
            </div>
            <div class="product-description">
                ${product.description || 'Provide your audience with an extensive array of options, ensuring a comprehensive showcase of the full range of product features. Our diverse selection caters to various preferences and needs, empowering customers to explore and find the perfect fit for their requirements.'}
            </div>
            ${benefits.length > 0 ? `
                <div class="benefits-section">
                    <h4 class="benefits-title">Benefits</h4>
                    <ul class="benefits-list">
                        ${benefits.map(benefit => `
                            <li class="benefit-item">
                                <div class="benefit-icon"></div>
                                <span>${benefit}</span>
                            </li>
                        `).join('')}
                    </ul>
                </div>
            ` : ''}
        </div>
    `;

    // Update order details
    document.getElementById('current-product-name').textContent = product.productGroupName;
    document.getElementById('current-product-price').textContent = formatPrice(product.price);
    
    // Add extras section to order details if they exist
    const orderSection = document.querySelector('.order-section');
    const existingExtras = orderSection.querySelector('.extras-section');
    if (existingExtras) {
        existingExtras.remove();
    }

    if (extrasHTML) {
        const orderTotalSection = orderSection.querySelector('.order-total-section');
        orderTotalSection.insertAdjacentHTML('beforebegin', extrasHTML);
    }

    // Update order total with extras included
    document.getElementById('order-total').textContent = formatPrice(finalTotal);
}
        // Render upgrade options
        function renderUpgradeOptions(products, selectedProductId) {
            const container = document.getElementById('upgrade-options-container');
            
            if (!products || products.length === 0) {
                container.innerHTML = '<div class="error">No upgrade options available</div>';
                return;
            }

            const upgradeOptionsHTML = products.map((product, index) => {
                const isSelected = product.productGroupId === selectedProductId;
                const hasSmallImage = product.url && product.url.trim() !== '';
                
                return `
                    <div class="upgrade-option" data-product-id="${product.productGroupId}">
                        <div class="upgrade-info">
                            <div class="upgrade-image">
                                ${hasSmallImage ? 
                                    `<img src="${product.url}" alt="${product.productGroupName}" onerror="this.parentElement.innerHTML='<div class=&quot;upgrade-image-placeholder&quot;>No Image</div>'" />` :
                                    `<div class="upgrade-image-placeholder">No Image</div>`
                                }
                            </div>
                            <div class="upgrade-details">
                                <div class="upgrade-name">${product.productGroupName}</div>
                                <div class="upgrade-price">${formatPrice(product.price)}</div>
                            </div>
                        </div>
                        <div class="upgrade-checkbox ${isSelected ? 'checked' : ''}"></div>
                    </div>
                `;
            }).join('');

            container.innerHTML = upgradeOptionsHTML;
            attachUpgradeEventListeners();
        }

        // Helper function to build URL with parameters
function buildUrlWithParams(baseUrl, additionalParams = {}) {
    const url = new URL(baseUrl, window.location.origin);
    
    // Add existing important parameters
    if (urlParams.title) {
        url.searchParams.set('title', urlParams.title);
    }
    if (urlParams.burialId) {
        url.searchParams.set('burialId', urlParams.burialId);
    }
    
    // Add any additional parameters
    Object.keys(additionalParams).forEach(key => {
        url.searchParams.set(key, additionalParams[key]);
    });
    
    return url.toString();
}

     // Replace the attachUpgradeEventListeners function
function attachUpgradeEventListeners() {
    document.querySelectorAll('.upgrade-option').forEach(option => {
        option.addEventListener('click', () => {
            const productId = option.dataset.productId;
            const product = findProductById(productId);
            
            if (product) {
                // Check if this is a different package than currently selected
                const orderData = getSavedOrderData();
                const currentPackageName = currentProduct ? currentProduct.productGroupName : '';
                
                if (product.productGroupName !== currentPackageName) {
                    // Clear extras when changing package
                    clearOrderData();
                    console.log('Package changed - clearing extras');
                }
                
                // Uncheck all checkboxes
                document.querySelectorAll('.upgrade-checkbox').forEach(checkbox => {
                    checkbox.classList.remove('checked');
                });
                
                // Check the clicked option
                const checkbox = option.querySelector('.upgrade-checkbox');
                checkbox.classList.add('checked');
                
                // Update the main product display
                updateProductDisplay(product);
                
                // Update sessionStorage with new selection
                const selectedPackage = {
                    ...product,
                    timestamp: Date.now()
                };
                sessionStorage.setItem('selectedPackage', JSON.stringify(selectedPackage));
            }
        });
    });
}
        // Show error state
        function showError(message) {
            document.getElementById('product-display-container').innerHTML = `<div class="error">${message}</div>`;
            document.getElementById('upgrade-options-container').innerHTML = `<div class="error">${message}</div>`;
        }

        // Initialize the cart page
        async function initializeCartPage() {
                updateHeader();

            try {
                // Fetch all products from API
                allProducts = await fetchPackages();
                
                if (!allProducts || allProducts.length === 0) {
                    showError('No products available');
                    return;
                }

                // Determine which product to display
                const selectedPackage = getSelectedPackage();
                let productToDisplay = null;

                if (selectedPackage) {
    // Try to find the selected product (handle both old and new format)
    const productId = getProductIdFromPackage(selectedPackage);
    productToDisplay = findProductById(productId);
}

                // If no selected product found, use the first product
                if (!productToDisplay) {
                    productToDisplay = allProducts[0];
                }

                // Update the display with the selected/default product
                updateProductDisplay(productToDisplay);

                // Render upgrade options
                renderUpgradeOptions(allProducts, productToDisplay.productGroupId);

            } catch (error) {
                console.error('Error initializing cart page:', error);
                showError('Failed to load cart details. Please try again later.');
            }
        }

        // Footer and other button handlers
        document.querySelector('.customize-btn').addEventListener('click', () => {
            // Store current selection and route to extras page
            if (currentProduct) {
    const selectedPackage = {
        ...currentProduct,
        timestamp: Date.now()
    };
    sessionStorage.setItem('selectedPackage', JSON.stringify(selectedPackage));
}
            window.location.href = '/WebResource?id=extras';
        });

        document.querySelector('.checkout-btn').addEventListener('click', () => {
    // Store current selection and route to invoice page
  if (currentProduct) {
    const selectedPackage = {
        ...currentProduct,
        timestamp: Date.now()
    };
    sessionStorage.setItem('selectedPackage', JSON.stringify(selectedPackage));
}
    
    // Build URL with parameters
    const invoiceUrl = buildUrlWithParams('/WebResource?id=invoice');

});

        document.querySelector('.back-btn').addEventListener('click', () => {

    const productsUrl = buildUrlWithParams('/WebResource?id=products');
    window.location.href = productsUrl;
});

        document.querySelector('.save-btn').addEventListener('click', () => {
  if (currentProduct) {
    const selectedPackage = {
        ...currentProduct,
        timestamp: Date.now()
    };
    sessionStorage.setItem('selectedPackage', JSON.stringify(selectedPackage));
}
        });

        // Start the application
        document.addEventListener('DOMContentLoaded', initializeCartPage);
