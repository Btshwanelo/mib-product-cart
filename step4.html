<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Choose Package</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background-color: #F9FAFB;
            color: #333;
        }

        /* Header */
        .header {
            background: #0BA5EC;
            color: white;
            padding: 12px 24px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 8px;
            font-weight: 600;
            font-size: 16px;
        }

        .logo-icon {
            width: 32px;
            height: 32px;
            background: rgba(255, 255, 255, 0.2);
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .search-container {
            flex: 1;
            max-width: 400px;
            margin: 0 24px;
            position: relative;
        }

        .search-input {
            width: 100%;
            padding: 10px 40px 10px 16px;
            border: none;
            border-radius: 8px;
            font-size: 14px;
            background: white;
            outline: none;
        }

        .search-icon {
            position: absolute;
            right: 12px;
            top: 50%;
            transform: translateY(-50%);
            color: #666;
        }

        .header-actions {
            display: flex;
            align-items: center;
            gap: 16px;
        }

        .quick-create {
            background: white;
            border: 1px solid rgba(255, 255, 255, 0.3);
            color: black;
            padding: 8px 16px;
            border-radius: 6px;
            font-size: 14px;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .user-avatar {
            width: 32px;
            height: 32px;
            background: white;
            border-radius: 50%;
            color: black;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 600;
            font-size: 14px;
            cursor: pointer;
        }

        /* Progress Steps */
        .progress-container {
            background: white;
            padding: 24px;
            border-bottom: 1px solid #e5e7eb;
            max-width: 1280px;
            margin:10px auto;
            border-radius: 16px;

        }

        .progress-steps {
            display: flex;
            justify-content: center;
            align-items: center;
            max-width: 600px;
            margin: 0 auto;
        }

        .step {
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            flex: 1;
            position: relative;
        }

        .step:not(:last-child)::after {
            content: '';
            position: absolute;
            top: 24px;
            right: -50%;
            width: 100%;
            height: 2px;
            background: #e5e7eb;
            z-index: 1;
        }

        /* .step.active:not(:last-child)::after {
            background: #1e9cfa;
        } */

        .step-icon {
            width: 48px;
            height: 48px;
            border-radius: 12px;
            background: #fff;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 12px;
            position: relative;
            z-index: 2;
            font-size: 20px;
            color: #9ca3af;
            border: 1px solid #E4E7EC;
        }

        /* .step.active .step-icon {
            background: #1e9cfa;
            color: white;
        } */

        .step-label {
            font-size: 14px;
            color: #6b7280;
            font-weight: 500;
        }

        .step.active .step-label {
            color: #344054;
        }

        /* Main Content */
        .main-content {
            background: white;
            padding: 32px 24px;
            min-height: calc(100vh - 200px);
            max-width: 1280px;
            margin:10px auto;
            border-radius: 16px;
        }

        .content-wrapper {
            max-width: 1200px;
            margin: 0 auto;
        }

        .page-title {
            font-size: 30px;
            font-weight: 700;
            color: #1A1A1A;
            margin-bottom: 8px;
        }

        .page-subtitle {
            font-size: 18px;
            color: #1A1A1A;
            font-weight: 400;
            margin-bottom: 48px;
        }

        /* Package Grid */
        .packages-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 24px;
            margin: 0 auto;
        }

        .package-card {
            background: white;
            border: 1px solid #E4E7EC;
            border-radius: 12px;
            padding: 24px;
            text-align: center;
            transition: all 0.2s ease;
            cursor: pointer;
        }

        .package-card:hover {
            border-color: #1e9cfa;
            box-shadow: 0 4px 12px rgba(30, 156, 250, 0.15);
        }

        .package-image {
            /* width: 200px;
            height: 120px; */
            margin: 0 auto 24px;
            background: #F4F4F4;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }

        .package-image img {
            width: 100%;
            height: 100%;
            object-fit: contain;
        }

        .package-name {
            font-size: 20px;
            font-weight: 600;
            color: #111827;
            margin-bottom: 8px;
            justify-self: left;
        }

        .package-price {
            font-size: 18px;
            color: #6b7280;
            margin-bottom: 20px;
            justify-self: left;
        }

        .proceed-btn {
            background: #0086C9;
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            width: 100%;
            margin-bottom: 12px;
            transition: background 0.2s ease;
        }

        .proceed-btn:hover {
            background: #0284c7;
        }

        .view-benefits {
            background: none;
            border: none;
            color: #475467;
            font-size: 14px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 4px;
            width: 100%;
            padding: 8px;
        }

        /* Footer Navigation */
        .footer-nav {
            background: white;
            padding: 16px 24px;
            border-top: 1px solid #e5e7eb;
            display: flex;
            justify-content: space-between;
            align-items: center;
            max-width: 1280px;
            margin:10px auto;
            border-radius: 16px;
        }

        .back-btn {
            background: none;
            border: none;
            color: #6b7280;
            font-size: 14px;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 8px 16px;
        }

        .save-btn {
            background: #f3f4f6;
            border: none;
            color: #6b7280;
            font-size: 14px;
            padding: 8px 24px;
            border-radius: 6px;
            cursor: pointer;
        }

        /* Responsive Design */
        @media (max-width: 768px) {
            .header {
                padding: 12px 16px;
            }

            .search-container {
                margin: 0 16px;
                max-width: none;
            }

            .progress-container {
                padding: 16px;
            }

            .progress-steps {
                gap: 16px;
            }

            .step-icon {
                width: 40px;
                height: 40px;
            }

            .step-label {
                font-size: 12px;
            }

            .main-content {
                padding: 24px 16px;
            }

            .page-title {
                font-size: 24px;
            }

            .packages-grid {
                grid-template-columns: 1fr;
                gap: 16px;
            }

            .package-card {
                padding: 20px;
            }

            .package-image {
                width: 150px;
                height: 100px;
            }

            .footer-nav {
                padding: 16px;
            }
        }

        @media (max-width: 480px) {
            .header-actions .quick-create span {
                display: none;
            }

            .search-input {
                font-size: 16px; /* Prevents zoom on iOS */
            }

            .page-subtitle {
                margin-bottom: 32px;
            }

            .package-image {
                width: 120px;
                height: 80px;
            }

            .proceed-btn {
                padding: 14px 24px;
                font-size: 16px;
                background-color: #0086C9;
            }
        }
    </style>
</head>
<body>
    <!-- Header -->
    <div class="header">
        <div class="logo">
            <div class="logo-icon">☁</div>
            <span>Company Name</span>
        </div>
        <div class="search-container">
            <input type="text" class="search-input" placeholder="Search for a page">
            <div class="search-icon"></div>
        </div>
        <div class="header-actions">
            <button class="quick-create">
                <!-- <span >⊕</span> -->
                <span>Quick Create</span>
            </button>
            <div class="user-avatar">MM</div>
        </div>
    </div>

    <!-- Progress Steps -->
    <div class="progress-container">
        <div class="progress-steps">
            <div class="step active">
                <div class="step-icon">
                    <img src="/assets/package.svg" width="24" height="24" alt="Package Icon" />
                </div>
                <div class="step-label">Choose Package</div>
            </div>
            <div class="step">
                <div class="step-icon">
                    <img src="/assets/shopping-bag-03.svg" width="24" height="24" alt="Package Icon" />
                </div>
                <div class="step-label">Cart & Customization</div>
            </div>
            <div class="step">
                <div class="step-icon">
                    <img src="/assets/file-check-02.svg" width="24" height="24" alt="Package Icon" />
                </div>
                <div class="step-label">Invoice</div>
            </div>
        </div>
    </div>

    <!-- Main Content -->
    <div class="main-content">
        <div class="content-wrapper">
            <h1 class="page-title">Choose your package</h1>
            <p class="page-subtitle">Select your package from the list below.</p>

            <div class="packages-grid">
                <!-- Kingston Maluti Package -->
                <div class="package-card">
                    <div class="package-image">
                        <img src="/assets/one.png" alt="Kingston Maluti Package" style="width: 100%; height: 100%; object-fit: cover; border-radius: 8px;">
                    </div>
                    <h3 class="package-name">Kingston Maluti</h3>
                    <p class="package-price">R30 000</p>
                    <button class="proceed-btn">Proceed to cart</button>
                    <button class="view-benefits">View Benefits </button>
                </div>

                <!-- Fantasy-Matt Package -->
                <div class="package-card">
                    <div class="package-image">
                        <img src="/assets/two.png" alt="Kingston Maluti Package" style="width: 100%; height: 100%; object-fit: cover; border-radius: 8px;">
                    </div>
                    <h3 class="package-name">Fantasy-Matt</h3>
                    <p class="package-price">R35 500</p>
                    <button class="proceed-btn">Proceed to cart</button>
                    <button class="view-benefits">View Benefits </button>
                </div>

                <!-- Pine/RS Gold Package -->
                <div class="package-card">
                    <div class="package-image">
                        <img src="/assets/three.png" alt="Kingston Maluti Package" style="width: 100%; height: 100%; object-fit: cover; border-radius: 8px;">
                    </div>
                    <h3 class="package-name">Pine/RS Gold</h3>
                    <p class="package-price">R25 500</p>
                    <button class="proceed-btn">Proceed to cart</button>
                    <button class="view-benefits">View Benefits </button>
                </div>
            </div>
        </div>
    </div>

    <!-- Footer Navigation -->
    <div class="footer-nav">
        <button class="back-btn">
            ← Back
        </button>
        <button class="save-btn">Save</button>
    </div>

    <script>
        // Add click handlers for interactivity
        document.querySelectorAll('.proceed-btn').forEach(btn => {
            btn.addEventListener('click', (e) => {
                e.stopPropagation();
                const packageName = btn.closest('.package-card').querySelector('.package-name').textContent;
                alert(`Proceeding to cart with ${packageName}`);
            });
        });

        document.querySelectorAll('.view-benefits').forEach(btn => {
            btn.addEventListener('click', (e) => {
                e.stopPropagation();
                const packageName = btn.closest('.package-card').querySelector('.package-name').textContent;
                alert(`Viewing benefits for ${packageName}`);
            });
        });

        document.querySelector('.back-btn').addEventListener('click', () => {
            alert('Going back to previous step');
        });

        document.querySelector('.save-btn').addEventListener('click', () => {
            alert('Saving current selection');
        });

        document.querySelector('.quick-create').addEventListener('click', () => {
            alert('Opening Quick Create');
        });
    </script>
</body>
</html>
