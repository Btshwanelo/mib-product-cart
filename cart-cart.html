<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Cart & Customization</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
          Oxygen, Ubuntu, Cantarell, sans-serif;
        background-color: #f5f5f5;
        color: #333;
      }

      /* Header */
      .header {
        background: #fff;
        color: black;
        padding: 12px 24px;
        display: flex;
        align-items: center;
        justify-content: center;
        box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
      }

      .header h1 {
        font-size: 20px;
      }

      .logo {
        display: flex;
        align-items: center;
        gap: 8px;
        font-weight: 600;
        font-size: 16px;
      }

      .logo-icon {
        width: 32px;
        height: 32px;
        border-radius: 8px;
        display: flex;
        align-items: center;
        justify-content: center;
      }

      .search-container {
        flex: 1;
        max-width: 400px;
        margin: 0 24px;
        position: relative;
      }

      .search-input {
        width: 100%;
        padding: 10px 40px 10px 16px;
        border: none;
        border-radius: 8px;
        font-size: 14px;
        background: white;
        outline: none;
      }

      .search-icon {
        position: absolute;
        right: 12px;
        top: 50%;
        transform: translateY(-50%);
        color: #666;
      }

      .header-actions {
        display: flex;
        align-items: center;
        gap: 16px;
      }

      .quick-create {
        background: rgba(255, 255, 255, 0.15);
        border: 1px solid rgba(255, 255, 255, 0.3);
        color: white;
        padding: 8px 16px;
        border-radius: 6px;
        font-size: 14px;
        cursor: pointer;
        display: flex;
        align-items: center;
        gap: 6px;
      }

      .user-avatar {
        width: 32px;
        height: 32px;
        background: white;
        border-radius: 50%;
        color: black;
        display: flex;
        align-items: center;
        justify-content: center;
        font-weight: 600;
        font-size: 14px;
        cursor: pointer;
      }

      /* Progress Steps */
      .progress-container {
        background: white;
        padding: 24px;
        border-bottom: 1px solid #e5e7eb;
        max-width: 1280px;
        margin: 10px auto;
        border-radius: 16px;
      }

      .progress-steps {
        display: flex;
        justify-content: center;
        align-items: center;
        max-width: 600px;
        margin: 0 auto;
      }

      .step {
        display: flex;
        flex-direction: column;
        align-items: center;
        text-align: center;
        flex: 1;
        position: relative;
      }

      .step:not(:last-child)::after {
        content: "";
        position: absolute;
        top: 24px;
        right: -50%;
        width: 100%;
        height: 2px;
        background: #e5e7eb;
        z-index: 1;
      }

      .step-icon {
        width: 48px;
        height: 48px;
        border-radius: 12px;
        background: #fff;
        display: flex;
        align-items: center;
        justify-content: center;
        margin-bottom: 12px;
        position: relative;
        z-index: 2;
        font-size: 20px;
        color: #9ca3af;
        border: 1px solid #e4e7ec;
      }

      .step-label {
        font-size: 14px;
        color: #6b7280;
        font-weight: 500;
      }

      .step.active .step-label {
        color: #344054;
      }

      /* Main Content */
      .main-content {
        background: white;
        padding: 32px 14px;
        min-height: calc(100vh - 200px);
        max-width: 1280px;
        margin: 10px auto;
        border-radius: 16px;
        display: flex;
      }

      .content-wrapper {
        margin: 0 auto;
        display: grid;
        grid-template-columns: 1fr 400px;
        gap: 48px;
      }

      /* Left Column - Product Info */
      .product-section {
        display: flex;
        flex-direction: column;
        align-items: center;
      }

      .product-display {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        margin-bottom: 0;
        width: 100%;
      }

      .product-image {
        width: 100%;
        max-width: 600px;
        height: 400px;
        background: white;
        border-radius: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        box-shadow: none;
        margin-bottom: 32px;
      }

      .product-image img {
        width: 100%;
        height: 100%;
        object-fit: contain;
        border-radius: 8px;
      }

      .product-image-placeholder {
        width: 100%;
        height: 100%;
        background: #f3f4f6;
        border-radius: 8px;
        display: flex;
        align-items: center;
        justify-content: center;
        color: #9ca3af;
        font-size: 16px;
      }

      .product-description {
        color: #6b7280;
        font-size: 16px;
        line-height: 1.6;
        max-width: 600px;
        text-align: left;
      }

      /* Right Column - Order Details */
      .order-section {
        background: #f9fafb;
        border-radius: 12px;
        padding: 24px;
        height: fit-content;
      }

      .order-title {
        font-size: 16px;
        color: #6b7280;
        margin-bottom: 8px;
      }

      .product-name {
        font-size: 24px;
        font-weight: 700;
        color: #111827;
        margin-bottom: 8px;
      }

      .product-price {
        font-size: 24px;
        font-weight: 700;
        color: #111827;
        margin-bottom: 24px;
      }

      .order-total-section {
        border-top: 1px solid #e5e7eb;
        padding-top: 16px;
        margin-bottom: 24px;
      }

      .order-total-row {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 8px;
      }

      .order-total-label {
        font-size: 16px;
        color: #111827;
        font-weight: 600;
      }

      .order-total-value {
        font-size: 18px;
        font-weight: 700;
        color: #111827;
      }

      .customize-btn {
        background: white;
        border: 1px solid #d1d5db;
        color: #374151;
        padding: 12px 24px;
        border-radius: 8px;
        font-size: 14px;
        font-weight: 600;
        cursor: pointer;
        width: 100%;
        margin-bottom: 12px;
        transition: all 0.2s ease;
      }

      .customize-btn:hover {
        border-color: #1e9cfa;
        background: #f0f9ff;
      }

      .checkout-btn {
        background: #0086c9;
        color: white;
        border: none;
        padding: 12px 24px;
        border-radius: 8px;
        font-size: 14px;
        font-weight: 600;
        cursor: pointer;
        width: 100%;
        margin-bottom: 24px;
        transition: background 0.2s ease;
      }

      .benefit-icon {
        width: 16px;
        height: 16px;
        border: 2px solid #0086c9;
        border-radius: 50%;
        display: flex;
        align-items: center;
        justify-content: center;
        flex-shrink: 0;
      }

      .benefit-icon::after {
        content: "✓";
        color: #0086c9;
        font-size: 10px;
        font-weight: bold;
      }

      .benefit-item {
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 6px 0;
        font-size: 14px;
        color: #475467;
        text-align: left;
      }

      .benefits-list {
        list-style: none;
        padding: 0;
        margin: 0;
      }

      .benefits-title {
        font-size: 16px;
        font-weight: 600;
        color: #111827;
        margin-bottom: 16px;
        text-align: left;
      }

      .benefits-section {
        display: block;
        padding: 20px 0 0 0;
        border-top: 1px solid #e4e7ec;
        margin-top: 20px;
      }

      .checkout-btn:hover {
        background: #0284c7;
      }

      .upgrade-section {
        margin-top: 24px;
      }

      .upgrade-title {
        font-size: 16px;
        font-weight: 600;
        color: #111827;
        margin-bottom: 16px;
      }

      .upgrade-option {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 12px;
        border: 1px solid #e5e7eb;
        border-radius: 8px;
        margin-bottom: 8px;
        cursor: pointer;
        transition: all 0.2s ease;
      }

      .upgrade-option:hover {
        border-color: #1e9cfa;
        background: #f0f9ff;
      }

      .upgrade-info {
        display: flex;
        align-items: center;
        gap: 12px;
      }

      .upgrade-image {
        width: 40px;
        height: 24px;
        border-radius: 4px;
        display: flex;
        align-items: center;
        justify-content: center;
      }

      .upgrade-image img {
        width: 100%;
        height: 100%;
        object-fit: contain;
        border-radius: 4px;
      }

      .upgrade-image-placeholder {
        width: 100%;
        height: 100%;
        background: #f3f4f6;
        border-radius: 4px;
        display: flex;
        align-items: center;
        justify-content: center;
        color: #9ca3af;
        font-size: 10px;
      }

      .upgrade-details {
        display: flex;
        flex-direction: column;
      }

      .upgrade-name {
        font-size: 14px;
        font-weight: 600;
        color: #111827;
      }

      .upgrade-price {
        font-size: 12px;
        color: #6b7280;
      }

      .upgrade-checkbox {
        width: 18px;
        height: 18px;
        border: 2px solid #d1d5db;
        border-radius: 3px;
        cursor: pointer;
        position: relative;
      }

      .upgrade-checkbox.checked {
        background: #1e9cfa;
        border-color: #1e9cfa;
      }

      .upgrade-checkbox.checked::after {
        content: "✓";
        position: absolute;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        color: white;
        font-size: 12px;
        font-weight: bold;
      }

      /* Footer Navigation */
      .footer-nav {
        background: white;
        padding: 16px 24px;
        border-top: 1px solid #e5e7eb;
        display: flex;
        justify-content: space-between;
        align-items: center;
        max-width: 1280px;
        margin: 10px auto;
        border-radius: 16px;
      }

      .back-btn {
        background: #0086c9;
        border: none;
        color: white;
        font-size: 14px;
        padding: 8px 24px;
        border-radius: 6px;
        cursor: pointer;
      }

      .save-btn {
        background: #0086c9;
        border: none;
        color: white;
        font-size: 14px;
        padding: 8px 24px;
        border-radius: 6px;
        cursor: pointer;
      }

      /* Responsive Design */
      @media (max-width: 1024px) {
        .content-wrapper {
          grid-template-columns: 1fr;
          gap: 32px;
        }

        .order-section {
          order: -1;
        }
      }

      @media (max-width: 768px) {
        .header {
          padding: 12px 16px;
        }

        .search-container {
          margin: 0 16px;
          max-width: none;
        }

        .main-content {
          padding: 24px 16px;
        }

        .product-image {
          width: 100%;
          max-width: 350px;
          height: 200px;
        }

        .footer-nav {
          padding: 16px;
        }
      }

      @media (max-width: 480px) {
        .header-actions .quick-create span {
          display: none;
        }

        .product-image {
          height: 180px;
        }

        .order-section {
          padding: 20px;
        }
      }

      /* Loading and error states */
      .loading {
        display: flex;
        justify-content: center;
        align-items: center;
        height: 200px;
        color: #6b7280;
      }

      .error {
        display: flex;
        justify-content: center;
        align-items: center;
        height: 200px;
        color: #dc2626;
        text-align: center;
      }

      /* Modal Styles */
      .modal {
        display: none;
        position: fixed;
        z-index: 1000;
        left: 0;
        top: 0;
        width: 100%;
        height: 100%;
        background-color: rgba(0, 0, 0, 0.5);
      }

      .modal-content {
        background-color: white;
        margin: 15% auto;
        padding: 0;
        border-radius: 12px;
        width: 400px;
        max-width: 90%;
        box-shadow: 0 10px 25px rgba(0, 0, 0, 0.2);
      }

      .modal-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 24px 24px 0 24px;
      }

      .modal-icon {
        width: 48px;
        height: 48px;
        background: #fef3c7;
        border-radius: 50%;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 24px;
      }

      .modal-icon svg {
        color: #dc6803;
      }

      .modal-close {
        background: none;
        border: none;
        font-size: 24px;
        cursor: pointer;
        color: #9ca3af;
        padding: 0;
        width: 24px;
        height: 24px;
      }

      .modal-body {
        padding: 16px 24px 24px;
      }

      .modal-body h3 {
        font-size: 18px;
        font-weight: 600;
        color: #111827;
        margin-bottom: 8px;
      }

      .modal-body p {
        font-size: 14px;
        color: #6b7280;
        line-height: 1.5;
      }

      .modal-buttons {
        display: flex;
        gap: 12px;
        padding: 0 24px 24px;
      }

      .modal-btn-primary {
        background: #0086c9;
        color: white;
        border: none;
        padding: 12px 24px;
        border-radius: 8px;
        font-size: 14px;
        font-weight: 600;
        cursor: pointer;
        flex: 1;
      }

      .modal-btn-primary:hover {
        background: #0284c7;
      }

      .modal-btn-secondary {
        background: white;
        color: #374151;
        border: 1px solid #d1d5db;
        padding: 12px 24px;
        border-radius: 8px;
        font-size: 14px;
        font-weight: 600;
        cursor: pointer;
        flex: 1;
      }

      .modal-btn-secondary:hover {
        background: #f9fafb;
      }
    </style>
  </head>
  <body>
    <!-- Header -->
    <div class="header">
      <div class="">
        <h1 id="burial-header">Burial Planning</h1>
      </div>
    </div>

    <!-- Progress Steps -->
    <div class="progress-container">
      <div class="progress-steps">
        <div class="step">

              src="/WebResource?id=package"

        <div class="step active">
          <div class="step-icon">
            <img
              src="/WebResource?id=shopping-bag-03"
              width="24"
              height="24"
              alt="Package Icon"
            />
          </div>
          <div class="step-label">Cart & Customization</div>
        </div>
        <div class="step">
          <div class="step-icon">
            <img
              src="/WebResource?id=file-check-02"
              width="24"
              height="24"
              alt="Package Icon"
            />
          </div>
          <div class="step-label">Invoice</div>
        </div>
      </div>
    </div>

    <!-- Main Content -->
    <div class="main-content">
      <div class="content-wrapper">
        <!-- Left Column - Product Display -->
        <div id="product-display-container">
          <div class="loading">Loading product details...</div>
        </div>

        <!-- Right Column - Order Details -->
        <div class="order-section">
          <div class="order-title">Order Details</div>
          <h2 class="product-name" id="current-product-name">Loading...</h2>
          <div class="product-price" id="current-product-price">Loading...</div>

          <div class="order-total-section">
            <div class="order-total-row">
              <span class="order-total-label">Order Total</span>
              <span class="order-total-value" id="order-total">Loading...</span>

          <button class="customize-btn">Customize</button>
          <button class="checkout-btn">Proceed to Checkout</button>

    <!-- Footer Navigation -->
    <div class="footer-nav">
      <button class="back-btn">← Back</button>
      <button class="save-btn">Save</button>
    </div>

    <script>
      // API Configuration
      const API_BASE_URL = "https://mib.sandbox.api.ezra360.com/api/v1.0";
      const API_KEY = "1bcTCI.pWzRtox0PIXllAvT0hrPd0Sz32FvlhBIxBKgouivzfx";

      // Global variables
      let allProducts = [];
      let currentProduct = null;
      let urlParams = {}; // Add this line
      let burialId = ""; // Will be extracted from URL parameters

      // Function to extract URL parameters
      function getUrlParameters() {
        const params = {};
        let currentUrl = window.location.href;

        // Try to get the parent URL if we're in an iframe/nested context
        try {
          if (
            window.parent &&
            window.parent !== window &&
            window.parent.location
          ) {
            currentUrl = window.parent.location.href;
          }
        } catch (e) {
          // Cross-origin restriction - try alternative methods
          console.log(
            "Cannot access parent URL due to cross-origin restrictions"
          );
        }

        // Alternative: Check if referrer contains our parameters
        if (document.referrer && document.referrer.includes("title=")) {
          currentUrl = document.referrer;
        }

        // Debug logging
        console.log("Current page URL:", window.location.href);
        console.log("Parent/Referrer URL:", currentUrl);
        console.log("Document referrer:", document.referrer);

        try {
          // Method 1: Parse current page parameters
          const urlSearchParams = new URLSearchParams(window.location.search);
          for (const [key, value] of urlSearchParams) {
            params[key] = decodeURIComponent(value);
          }

          // Method 2: Parse from the full URL (parent or referrer)
          const titleMatch = currentUrl.match(/[?&]title=([^&]+)/);
          const burialIdMatch = currentUrl.match(/[?&]burialId=([^&]+)/);

          if (titleMatch) {
            try {
              params.title = decodeURIComponent(titleMatch[1]);
            } catch (e) {
              params.title = titleMatch[1];
            }
          }

          if (burialIdMatch) {
            try {
              params.burialId = decodeURIComponent(burialIdMatch[1]);
            } catch (e) {
              params.burialId = burialIdMatch[1];
            }
          }

          // Method 3: Try to parse from hash if parameters are there
          if (window.location.hash) {
            const hashParams = window.location.hash.substring(1);
            const hashUrlParams = new URLSearchParams(hashParams);
            for (const [key, value] of hashUrlParams) {
              params[key] = decodeURIComponent(value);
            }
          }
        } catch (error) {
          console.error("Error parsing URL parameters:", error);
        }

        return params;
      }

      // Function to extract burial ID and name from title parameter
      function parseTitle(title) {
        if (!title) return { burialId: "", name: "" };

        // Expected format: "B001665 - Thabiso Zungu"
        const parts = title.split(" - ");
        if (parts.length >= 2) {
          return {
            burialId: parts[0].trim(),
            name: parts.slice(1).join(" - ").trim(),
          };
        }

        // Fallback: if format is different, try to extract what we can
        return {
          burialId: parts[0] || "",
          name: title,
        };
      }

      // Function to update the header with extracted information
      function updateHeader() {
        urlParams = getUrlParameters();
        console.log("urlParams---", urlParams);
        const headerElement = document.getElementById("burial-header");

        // Always use the burialId parameter from URL for API calls
        if (urlParams.burialId) {
          burialId = urlParams.burialId; // Use the actual burialId parameter for API
        }

        // Extract name from title for display, regardless of which burialId we use
        let displayName = "Unknown";
        let displayBurialId = urlParams.burialId || "Unknown";

        if (urlParams.title) {
          const { burialId: extractedBurialId, name } = parseTitle(
            urlParams.title
          );
          if (name) {
            displayName = name;
          }
          // Use the extracted burialId from title for display (B001681)
          if (extractedBurialId) {
            displayBurialId = extractedBurialId;
          }
        }

        headerElement.textContent = `Burial Planning of: ${displayName} (${displayBurialId})`;

        // Log extracted parameters for debugging
        console.log("Extracted URL Parameters:", urlParams);
        console.log("Extracted BurialId:", burialId);
        console.log(
          "Parsed title:",
          urlParams.title ? parseTitle(urlParams.title) : "No title parameter"
        );
      }

      // Fetch packages from API
      async function fetchPackages() {
        try {
          console.log("Fetching packages with burialId:", burialId);
          const myHeaders = new Headers();
          myHeaders.append("api-key", API_KEY);
          myHeaders.append("Content-Type", "application/json");

          const raw = JSON.stringify({
            entityName: "ProductGroup",
            requestName: "ProductGroupListingExecuteRequest",
            inputParamters: {
              ProductData: {
                BurialId: burialId,
              },
            },
          });

          const requestOptions = {
            method: "POST",
            headers: myHeaders,
            body: raw,
            redirect: "follow",
          };

          const response = await fetch(
            `${API_BASE_URL}/entities/ExecuteRequest`,
            requestOptions
          );
          const result = await response.json();

          if (
            result.isSuccess &&
            result.outputParameters &&
            result.outputParameters.ProductGroupData
          ) {
            return result.outputParameters.ProductGroupData;
          } else {
            throw new Error("Failed to fetch packages");
          }
        } catch (error) {
          console.error("Error fetching packages:", error);
          throw error;
        }
      }

      // Format price for display
      function formatPrice(price) {
        if (price === 0 || price === 0.0) {
          return "Contact for Price";
        }
        return `R${price.toLocaleString()}`;
      }

      // Parse benefits string into array
      function parseBenefits(benefitsString) {
        if (!benefitsString) return [];
        return benefitsString
          .split(",")
          .map((benefit) => benefit.trim())
          .filter((benefit) => benefit.length > 0);
      }

      // Get selected package from memory (session) storage or return null
      function getSelectedPackage() {
        try {
          const stored = sessionStorage.getItem("selectedPackage");
          if (stored) {
            const parsed = JSON.parse(stored);
            // Check if the selection is recent (within 1 hour)
            if (Date.now() - parsed.timestamp < 3600000) {
              // Handle old format (convert to new format if needed)
              if (parsed.id && !parsed.productGroupId) {
                parsed.productGroupId = parsed.id;
              }
              if (parsed.name && !parsed.productGroupName) {
                parsed.productGroupName = parsed.name;
              }
              return parsed;
            }
          }
        } catch (error) {
          console.error("Error reading selected package:", error);
        }
        return null;
      }

      function findProductById(productId) {
        return allProducts.find(
          (product) => product.productGroupId === productId
        );
      }

      // Add this helper function
      function getProductIdFromPackage(packageData) {
        return packageData.productGroupId || packageData.id;
      }

      // Update product display
      function updateProductDisplay(product) {
        if (!product) return;

        currentProduct = product;
        const benefits = parseBenefits(product.benefits);
        const imageUrl = Array.isArray(product.url)
          ? product.url[0]
          : product.url;
        const hasImage = imageUrl && imageUrl.trim() !== "";

        // Update main product display
        const productDisplayContainer = document.getElementById(
          "product-display-container"
        );
        productDisplayContainer.innerHTML = `
                <div>
                    <div class="product-image">
                        ${
                          hasImage
                            ? `<img src="${imageUrl}" alt="${product.productGroupName}" onerror="this.parentElement.innerHTML='<div class=&quot;product-image-placeholder&quot;>No Image Available</div>'" />`
                            : `<div class="product-image-placeholder">No Image Available</div>`
                        }
                    </div>
                    <div class="product-description">
                        ${
                          product.description ||
                          "Provide your audience with an extensive array of options, ensuring a comprehensive showcase of the full range of product features. Our diverse selection caters to various preferences and needs, empowering customers to explore and find the perfect fit for their requirements."
                        }
                    </div>
                    ${
                      benefits.length > 0
                        ? `
                        <div class="benefits-section">
                            <h4 class="benefits-title">Benefits</h4>
                            <ul class="benefits-list">
                                ${benefits
                                  .map(
                                    (benefit) => `
                                    <li class="benefit-item">
                                        <div class="benefit-icon"></div>
                                        <span>${benefit}</span>
                                    </li>
                                `
                                  )
                                  .join("")}
                            </ul>
                        </div>
                    `
                        : ""
                    }
                </div>
            `;

        // Update order details
        document.getElementById("current-product-name").textContent =
          product.productGroupName;
        document.getElementById("current-product-price").textContent =
          formatPrice(product.price);
        document.getElementById("order-total").textContent = formatPrice(
          product.price
        );
      }

      // Render upgrade options
      function renderUpgradeOptions(products, selectedProductId) {
        const container = document.getElementById("upgrade-options-container");

        if (!products || products.length === 0) {
          container.innerHTML =
            '<div class="error">No upgrade options available</div>';
          return;
        }

        const upgradeOptionsHTML = products
          .map((product, index) => {
            const isSelected = product.productGroupId === selectedProductId;
            const smallImageUrl = Array.isArray(product.url)
              ? product.url[0]
              : product.url;
            const hasSmallImage = smallImageUrl && smallImageUrl.trim() !== "";

            return `
                    <div class="upgrade-option" data-product-id="${
                      product.productGroupId
                    }">
                        <div class="upgrade-info">
                            <div class="upgrade-image">
                                ${
                                  hasSmallImage
                                    ? `<img src="${smallImageUrl}" alt="${product.productGroupName}" onerror="this.parentElement.innerHTML='<div class=&quot;upgrade-image-placeholder&quot;>No Image</div>'" />`
                                    : `<div class="upgrade-image-placeholder">No Image</div>`
                                }
                            </div>
                            <div class="upgrade-details">
                                <div class="upgrade-name">${
                                  product.productGroupName
                                }</div>
                                <div class="upgrade-price">${formatPrice(
                                  product.price
                                )}</div>
                            </div>
                        </div>
                        <div class="upgrade-checkbox ${
                          isSelected ? "checked" : ""
                        }"></div>
                    </div>
                `;
          })
          .join("");

        container.innerHTML = upgradeOptionsHTML;
        attachUpgradeEventListeners();
      }

      // Helper function to build URL with parameters
      function buildUrlWithParams(baseUrl, additionalParams = {}) {
        const url = new URL(baseUrl, window.location.origin);

        // Add existing important parameters
        if (urlParams.title) {
          url.searchParams.set("title", urlParams.title);
        }
        if (urlParams.burialId) {
          url.searchParams.set("burialId", urlParams.burialId);
        }

        // Add any additional parameters
        Object.keys(additionalParams).forEach((key) => {
          url.searchParams.set(key, additionalParams[key]);
        });

        return url.toString();
      }

      // Attach event listeners to upgrade options
      function attachUpgradeEventListeners() {
        document.querySelectorAll(".upgrade-option").forEach((option) => {
          option.addEventListener("click", () => {
            const productId = option.dataset.productId;
            const product = findProductById(productId);

            if (product) {
              // Uncheck all checkboxes
              document
                .querySelectorAll(".upgrade-checkbox")
                .forEach((checkbox) => {
                  checkbox.classList.remove("checked");
                });

              // Check the clicked option
              const checkbox = option.querySelector(".upgrade-checkbox");
              checkbox.classList.add("checked");

              // Update the main product display
              updateProductDisplay(product);

              // Update sessionStorage with new selection
              const selectedPackage = {
                ...product,
                timestamp: Date.now(),
              };
              sessionStorage.setItem(
                "selectedPackage",
                JSON.stringify(selectedPackage)
              );
            }
          });
        });
      }

      // Show error state
      function showError(message) {
        document.getElementById(
          "product-display-container"
        ).innerHTML = `<div class="error">${message}</div>`;
        document.getElementById(
          "upgrade-options-container"
        ).innerHTML = `<div class="error">${message}</div>`;
      }

      // Initialize the cart page
      async function initializeCartPage() {
        updateHeader();

        try {
          // Fetch all products from API
          allProducts = await fetchPackages();

          if (!allProducts || allProducts.length === 0) {
            showError("No products available");
            return;
          }

          // Determine which product to display
          const selectedPackage = getSelectedPackage();
          let productToDisplay = null;

          if (selectedPackage) {
            // Try to find the selected product (handle both old and new format)
            const productId = getProductIdFromPackage(selectedPackage);
            productToDisplay = findProductById(productId);
          }

          // If no selected product found, use the first product
          if (!productToDisplay) {
            productToDisplay = allProducts[0];
          }

          // Update the display with the selected/default product
          updateProductDisplay(productToDisplay);

          // Render upgrade options
          renderUpgradeOptions(allProducts, productToDisplay.productGroupId);
        } catch (error) {
          console.error("Error initializing cart page:", error);
          showError("Failed to load cart details. Please try again later.");
        }
      }

      // Footer and other button handlers
      document.querySelector(".customize-btn").addEventListener("click", () => {
        // Store current selection and route to extras page
        if (currentProduct) {
          const selectedPackage = {
            ...currentProduct,
            timestamp: Date.now(),
          };
          sessionStorage.setItem(
            "selectedPackage",
            JSON.stringify(selectedPackage)
          );
        }
        window.location.href = "/WebResource?id=cart-extras";
      });

      document.querySelector(".checkout-btn").addEventListener("click", () => {
        // Store current selection and route to invoice page
        if (currentProduct) {
          const selectedPackage = {
            ...currentProduct,
            timestamp: Date.now(),
          };
          sessionStorage.setItem(
            "selectedPackage",
            JSON.stringify(selectedPackage)
          );
        }

        window.location.href = "/WebResource?id=cart-invoice";
      });

      document.querySelector(".back-btn").addEventListener("click", () => {
        // Go back to package selection
        const productsUrl = buildUrlWithParams("/WebResource?id=cart-products");
        window.location.href = productsUrl;
      });

      document.querySelector(".save-btn").addEventListener("click", () => {
        // Show the save modal
        document.getElementById("save-modal").style.display = "block";
      });

      // Add these new functions:
      function closeSaveModal() {
        document.getElementById("save-modal").style.display = "none";
      }

      function confirmSave() {
        // Save current selections
        if (currentProduct) {
          const selectedPackage = {
            ...currentProduct,
            timestamp: Date.now(),
          };
          sessionStorage.setItem(
            "selectedPackage",
            JSON.stringify(selectedPackage)
          );
        }

        // Redirect the parent page to the specified URL
        window.parent.location.href =
          "https://mib.sandbox.ezra360.com/Entity/List/Burial?mod=BurialServices";
      }

      // Close modal when clicking outside of it
      window.onclick = function (event) {
        const modal = document.getElementById("save-modal");
        if (event.target == modal) {
          closeSaveModal();
        }
      };

      // Start the application
      document.addEventListener("DOMContentLoaded", initializeCartPage);
    </script>

    <!-- Save Modal -->
    <div id="save-modal" class="modal" style="display: none">
      <div class="modal-content">
        <div class="modal-header">
          <div class="modal-icon">
            <svg
              xmlns="http://www.w3.org/2000/svg"
              width="24"
              height="24"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
              class="lucide lucide-circle-alert-icon lucide-circle-alert"
            >
              <circle cx="12" cy="12" r="10" />
              <line x1="12" x2="12" y1="8" y2="12" />
              <line x1="12" x2="12.01" y1="16" y2="16" />
            </svg>
          </div>
          <button class="modal-close" onclick="closeSaveModal()">
            &times;
          </button>
        </div>
        <div class="modal-body">
          <h3>Saving Order</h3>
          <p>Are you sure you want to save this order to continue later?</p>
        </div>
        <div class="modal-buttons">
          <button class="modal-btn-primary" onclick="confirmSave()">
            Yes, Save
          </button>
          <button class="modal-btn-secondary" onclick="closeSaveModal()">
            No, Continue
          </button>
        </div>
      </div>
    </div>
  </body>
</html>
